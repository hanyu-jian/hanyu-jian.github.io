name: Daily MAVIR Imbalance Price Update
on:
  schedule:
    - cron: "20 9 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backfill start data date, for example 2026-10-01. Empty = last 30 days."
        type: string
        default: ""
      end_date:
        description: "Backfill end data date (inclusive). Empty = 3 days ago."
        type: string
        default: ""

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install pandas requests openpyxl

      - name: Fetch MAVIR imbalance files
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          args=()
          if [ -n "$START_DATE" ]; then args+=(--start "$START_DATE"); fi
          if [ -n "$END_DATE" ]; then args+=(--end "$END_DATE"); fi
          python py/fetch/mavir/fetch_mavir_imbalance.py "${args[@]}"

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mavir
          git diff --cached --quiet || \
            git commit -m "chore: update MAVIR imbalance data $(date -u +'%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
