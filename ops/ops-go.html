<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Operations GO</title>
<script src="/ops/nav.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; }
.container { max-width: 1600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); overflow: hidden; }
.sub-nav { background: #f8f9fa; border-bottom: 2px solid #e6e9ed; padding: 0 30px; display: flex; }
.sub-nav-link { display: inline-block; padding: 14px 22px; font-size: 14px; font-weight: 600; color: #6c757d; text-decoration: none;
  border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color .2s, border-color .2s; white-space: nowrap; cursor: pointer; }
.sub-nav-link:hover { color: #2c3e50; }
.sub-nav-link.active { color: #2c3e50; border-bottom-color: #2c3e50; }
.status { padding: 14px 30px 0; font-size: 13px; color: #e74c3c; min-height: 8px; }
.chart-grid { display: grid; grid-template-columns: 1fr; gap: 24px; padding: 14px 30px 30px; }
.chart-grid > * { min-width: 0; }
.chart-card { background: #fff; border-radius: 8px; border: 1px solid #e6e9ed; padding: 16px; }
.chart-card-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.chart-card-header h3 { font-size: 18px; font-weight: 500; color: #2c3e50; border-left: 4px solid #2c3e50; padding-left: 12px; margin: 0; line-height: 1.3; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 8px; text-align: right; border-bottom: 1px solid #eef0f3; white-space: nowrap; }
th.l, td.l { text-align: left; }
th { background: #f3f5f7; font-size: 12px; color: #4a5560; }
tr.total td { font-weight: 700; background: #fafbfc; }
tr.sub td { font-weight: 600; background: #fafbfc; color: #4a5560; font-size: 12px; }
.pos { color: #1e8449; font-weight: 600; } .neg { color: #d35400; font-weight: 600; } .zero { color: #888; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: #fdecea; color: #c0392b; margin-left: 6px; }
select { font-family: inherit; height: 36px; padding: 0 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; color: #2c3e50; background: #fff; cursor: pointer; }
tr.exp td { color: #8a96a3; background: #fbfbfc; }
tr.hl td { background: #d6e9fb !important; }
tr.pick { cursor: pointer; } tr.pick:hover td { background: #f1f7fd; } tr.pick.sel td { background: #d6e9fb; }
tr.txhead td { padding: 0; background: #f4f9fe; }
tr.txh td { background: #f4f9fe; color: #6b7c8d; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; padding-top: 6px; padding-bottom: 6px; }
tr.tx td { background: #f4f9fe; color: #2c3e50; }
.txr { display: flex; padding-left: 20px; } .txr > span { display: inline-block; } .txr > span:nth-child(1) { width: 130px; } .txr > span:nth-child(2) { width: 110px; text-align: right; margin-right: 28px; } .txr > span:nth-child(3) { width: 220px; }
.bd { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 12px; font-weight: 600; background: #e3f0fb; color: #1b5a85; }
.bd.b1 { background: #efe6fa; color: #6b3fa0; } .bd.b2 { background: #e4f5ea; color: #1e6b3a; } .bd.b3 { background: #fdeede; color: #9a5a12; }
.nt { color: #8a96a3; font-size: 12px; margin-left: 8px; } .na { color: #a3adb8; }
#conTable th, #conTable td { padding: 8px 6px; }
#conTable th { white-space: normal; vertical-align: bottom; line-height: 1.3; }
.sw { display: inline-block; padding: 2px 8px; border-radius: 4px; }
/* wide screens: Contracts on the left, Yet-to-be-delivered GO on the right, to read them side by side */
@media (min-width: 1650px) {
  .container { max-width: 2600px; }
  .chart-grid { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); align-items: start; }
  #conTable, #dueTable { font-size: 12px; }
  #conTable th, #conTable td { padding: 7px 4px; }
  #dueTable th, #dueTable td { padding: 7px 6px; }
  #dueTable th { white-space: normal; vertical-align: bottom; line-height: 1.3; }
  #conTable th, #dueTable th { font-size: 11px; }
}
@media (max-width: 700px) {
  body { padding: 8px; } .chart-grid { padding: 14px 16px 16px; }
  .sub-nav { padding: 0 10px; overflow-x: auto; } .sub-nav-link { padding: 14px 14px; font-size: 13px; }
}
</style>
</head>
<body>
<div class="container">

  <div class="sub-nav">
    <a class="sub-nav-link" href="/ops/overview">Overview</a>
    <a class="sub-nav-link" href="/ops/capture-price">Capture Price</a>
    <a class="sub-nav-link" href="/ops/imbalance">Imbalance</a>
    <a class="sub-nav-link active" href="/ops/go">GO</a>
  </div>

  <div class="status" id="status"></div>

  <div class="chart-grid">
    <div class="chart-card">
      <div class="chart-card-header"><h3>Contracts</h3><select id="year"></select></div>
      <div class="scroll"><table id="conTable"></table></div>
    </div>

    <div class="chart-card">
      <div class="chart-card-header"><h3>Yet-to-be-delivered GO</h3><select id="dmode"><option value="amended">Delivery date: amended (current plan)</option><option value="original">Delivery date: original (before amendment)</option></select></div>
      <div class="scroll"><table id="dueTable"></table></div>
    </div>
  </div>
</div>

<script>
const SITES = ["Putnok", "Serenyfalva", "Sajokaza", "Szuhakálló 1", "Szuhakálló 2"];   // the five sites are always delivered together
const FIRST_YEAR = 2024;
let expiredSet = new Set();      // production months ("2026-06") whose GO have expired: read from the ledger column expired_production_months, left out of the production of the year
const $ = id => document.getElementById(id);
const nf = (v, d = 0) => v == null || isNaN(v) ? "–" : v.toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: 0 });
const URLQ = new URLSearchParams(location.search);
function syncUrl(o) {
  try { const p = new URLSearchParams(); for (const [k, v] of Object.entries(o)) if (v != null && v !== "") p.set(k, v);
    const q = p.toString(); history.replaceState(null, "", location.pathname + (q ? "?" + q : "") + location.hash); } catch (e) { /* the address bar is only a convenience */ }
}
function budapestToday() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "Europe/Budapest", year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
const TODAY = budapestToday(), THIS_YEAR = +TODAY.slice(0, 4);
let rows = [], tx = [], prod = {}, lastTs = {}, year = "ALL", selDue = null, dmode = "amended";

function parseCSV(text) {
  const out = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); out.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur || row.length) { row.push(cur); out.push(row); }
  const head = out.shift();
  return out.filter(r => r.length === head.length).map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
}
async function getText(url) {
  const r = await fetch(url, { credentials: "same-origin" });
  if (r.status === 404) return null;
  if (!r.ok) { let m = r.status; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
  return r.text();
}
// hourly meter CSV (Date, Meter [MWh], Meter [kWh]) → MWh per month; also remembers the last timestamp with a reading
function sumMonths(text, into, s) {
  const lines = text.split("\n");
  for (let i = 1; i < lines.length; i++) {
    const l = lines[i]; if (l.length < 20) continue;
    const c = l.split(","); if (c[1] === "" || c[1] === undefined) continue;
    const v = parseFloat(c[1]); if (isNaN(v)) continue;
    const m = +c[0].slice(5, 7) - 1;
    into[m] = (into[m] || 0) + v;
    if (c[0] > (lastTs[s] || "")) lastTs[s] = c[0];
  }
}
async function loadAll() {
  const yrs = []; for (let y = FIRST_YEAR; y <= THIS_YEAR; y++) yrs.push(y);
  const [salesText, txText, ...meters] = await Promise.all([
    getText("/ops/api/go-sales"),
    getText("/ops/api/go-transactions").catch(() => null),
    ...SITES.flatMap(s => yrs.map(y => getText(`/ops/api/metered?site=${encodeURIComponent(s)}&year=${y}&resolution=hourly`).catch(e => { throw new Error(`${s} ${y}: ${e.message}`); }))),
  ]);
  if (salesText == null) throw new Error("GO sales file not found");
  rows = parseCSV(salesText).map(r => ({ ...r, price: r.unit_price_eur_mwh === "" || r.unit_price_eur_mwh == null ? null : +r.unit_price_eur_mwh, id: +r.id, year: +r.year, no: +r.trade_no, signed: +r.signed_mwh, delivered: +r.delivered_mwh, amount: +r.amount_eur }));
  rows.forEach(r => { r.undelivered = r.signed - r.delivered; r.due = r.amended_delivery || r.delivery_date; if (r.price == null && r.signed) r.price = r.amount / r.signed; r.amount = r.signed * (r.price || 0); });   // total amount = signed GO × unit price
  expiredSet = new Set(rows.flatMap(r => (r.expired_production_months || "").split(";").map(x => x.trim()).filter(Boolean)));
  tx = txText ? parseCSV(txText).map(t => ({ ...t, vol: +t.volume_mwh })) : [];
  prod = {}; lastTs = {};
  let k = 0;
  for (const s of SITES) { prod[s] = {}; for (const y of yrs) { const t = meters[k++]; if (t) { prod[s][y] = {}; sumMonths(t, prod[s][y], s); } } }
}

// production of the five sites in a year (MWh): months with a complete reading only, 2024 from August (the first month that was sold)
function monthProd(s, y, i) {
  const m = prod[s] && prod[s][y]; if (!m || m[i] == null) return null;
  if (y === 2024 && i < 7) return null;
  if (y === THIS_YEAR) {
    const t = lastTs[s]; if (t && +t.slice(0, 4) === y) {
      const mo = +t.slice(5, 7) - 1, day = +t.slice(8, 10), hr = +t.slice(11, 13);
      const full = day === new Date(Date.UTC(y, mo + 1, 0)).getUTCDate() && hr >= 23;
      if (i > mo || (i === mo && !full)) return null;
    }
  }
  return m[i];
}
function yearProd(y) { let a = 0, any = false; for (const s of SITES) for (let i = 0; i < 12; i++) { if (expiredSet.has(`${y}-${String(i + 1).padStart(2, "0")}`)) continue; const v = monthProd(s, y, i); if (v != null) { a += v; any = true; } } return any ? a : null; }
// production of the months whose GO have expired (MWh): shown next to the production that is left
function yearExpired(y) { let a = 0, any = false; for (const s of SITES) for (let i = 0; i < 12; i++) { if (!expiredSet.has(`${y}-${String(i + 1).padStart(2, "0")}`)) continue; const v = monthProd(s, y, i); if (v != null) { a += v; any = true; } } return any ? a : null; }
const MONN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function expiredLabel(y) {
  const ms = [...expiredSet].filter(k => +k.slice(0, 4) === y).map(k => +k.slice(5) - 1).sort((a, b) => a - b);
  if (!ms.length) return "";
  return (ms.every((m, i) => i === 0 || m === ms[i - 1] + 1) ? (ms.length > 1 ? `${MONN[ms[0]]}-${MONN[ms[ms.length - 1]]}` : MONN[ms[0]]) : ms.map(m => MONN[m]).join(", ")) + " " + y;
}
const cls = v => v == null ? "" : Math.round(v) > 0 ? "pos" : Math.round(v) < 0 ? "neg" : "zero";
const sgn = v => { if (v == null) return "–"; const r = Math.round(v); return r === 0 ? "0" : (r > 0 ? "+" : "") + nf(r); };

// Delivery lines = one per delivery date and buyer. With "amended" a contract row sits on its amended date when it has one, otherwise on its delivery date;
// a row that is partly delivered and has an amended date is split: the delivered part stays on the delivery date, the rest moves to the amended date.
// With "original" every row stays on its original delivery date (the plan before any amendment).
function dueMap() {
  const m = new Map(), add = (date, r, signed, delivered) => { const k = date + "|" + r.buyer, o = m.get(k) || { key: k, date, buyer: r.buyer, sig: 0, del: 0, vol: 0, rows: new Set() };
    o.sig += signed; o.del += delivered; o.vol += signed - delivered; o.rows.add(r.id); m.set(k, o); };
  rows.forEach(r => {
    if (dmode === "original") add(r.delivery_date, r, r.signed, r.delivered);
    else if (r.amended_delivery && r.delivered > 0.005 && r.delivered < r.signed - 0.005) { add(r.delivery_date, r, r.delivered, r.delivered); add(r.amended_delivery, r, r.signed - r.delivered, 0); }
    else add(r.due, r, r.signed, r.delivered);
  });
  return [...m.values()].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.buyer < b.buyer ? -1 : 1);
}
const bcls = b => "b" + ([...(b || "")].reduce((a, c) => a + c.charCodeAt(0), 0) % 4);      // a stable colour per buyer
function renderDue() {
  const dues = dueMap(), years = [...new Set(dues.map(d => d.date.slice(0, 4)))].filter(y => year === "ALL" || y === String(year)); let out = "";   // follows the year option of the Contracts table

  years.forEach(y => {
    const ds = dues.filter(d => d.date.slice(0, 4) === y);
    ds.forEach(d => {
      out += `<tr class="pick${selDue === d.key ? " sel" : ""}" data-key="${d.key}"><td class="l">${d.date}${d.date < TODAY && d.vol > 0.005 ? '<span class="tag">overdue</span>' : ""}</td>`
        + `<td>${nf(d.sig, 2)}</td><td>${nf(d.del, 2)}</td><td class="${d.vol > 0.005 ? "neg" : "zero"}">${nf(d.vol, 2)}</td><td></td><td class="l">${d.buyer || "–"}</td></tr>`;
      const t = selDue === d.key ? tx.filter(x => x.delivery_date === d.date && x.buyer === d.buyer) : [];
      if (t.length) out += `<tr class="txh"><td colspan="6" class="l"><div class="txr"><span>Transaction date</span><span>Volume (MWh)</span><span>Buyer</span></div></td></tr>`
        + t.map(x => `<tr class="tx"><td colspan="6" class="l"><div class="txr"><span>${x.transaction_date || '<span class="na" title="date not known">—</span>'}</span><span>${nf(x.vol, 2)}</span><span><span class="bd ${bcls(x.buyer)}">${x.buyer}</span>${x.note ? `<span class="nt">${x.note}</span>` : ""}</span></div></td></tr>`).join("");
    });
    // year summary: whole-year production (without the expired months) and what is left of it after the deliveries of the year
    const S = ds.reduce((a, d) => a + d.sig, 0), D = ds.reduce((a, d) => a + d.del, 0), U = S - D, P = +y <= THIS_YEAR ? yearProd(+y) : null;
    out += `<tr class="total"><td class="l">${y} total</td><td>${nf(S, 2)}</td><td>${nf(D, 2)}</td><td class="${U > 0.005 ? "neg" : "zero"}">${nf(U, 2)}</td>`
      + (P == null ? `<td>–</td>` : `<td class="${cls(P - D)}">${sgn(P - D)}</td>`) + `<td></td></tr>`;
  });
  $("dueTable").innerHTML = `<tr><th class="l">Delivery date</th><th>Signed GO (MWh)</th><th>Delivered GO (MWh)</th><th>Yet-to-be-delivered GO (MWh)</th><th title="Production − Delivered of the year (production of the five sites, complete months, without the expired months): GO in hand that can still be delivered">Available to deliver (MWh)</th><th class="l">Buyer</th></tr>` + out;
  $("dueTable").querySelectorAll("tr.pick").forEach(tr => tr.onclick = () => pickDue(tr.dataset.key));
}
// click a delivery line: the rows of the Contracts table that add up to it are highlighted, and its transactions (transaction date / volume / buyer) open underneath
function pickDue(key) {
  selDue = selDue === key ? null : key;
  const d = selDue && dueMap().find(x => x.key === selDue);
  if (d && year !== "ALL" && [...d.rows].some(id => rows.find(r => r.id === id).year !== +year)) { year = "ALL"; $("year").value = "ALL"; syncUrl({}); }
  renderDue(); renderContracts();
}

const PALETTE = ["#dff3e3", "#d9ecf7", "#eceff1", "#dbe3fa", "#fff3c4", "#fde2e4", "#e8def8", "#fde8d0"];
function renderContracts() {
  const keys = []; rows.forEach(r => { const k = (r.signing_date || "") + "|" + r.buyer; if (!keys.includes(k)) keys.push(k); });
  const color = {}; keys.forEach((k, i) => { color[k] = /^\d{4}-\d{2}-\d{2}\|/.test(k) ? PALETTE[i % PALETTE.length] : "#ffffff"; });
  const hlRows = new Set((selDue && (dueMap().find(x => x.key === selDue) || {}).rows) || []);
  const price = r => r.price != null ? r.price : (r.signed ? r.amount / r.signed : null), years = [...new Set(rows.map(r => r.year))].sort(), shown = year === "ALL" ? years : [+year];
  let out = "", T = { S: 0, D: 0, A: 0, P: 0, anyP: false, S2: 0 };
  shown.forEach(y => {
    const rs = rows.filter(r => r.year === y); let first = true;
    rs.forEach(r => {
      out += `<tr${hlRows.has(r.id) ? ' class="hl"' : ""}><td class="l">${first ? y : ""}</td><td class="l">${r.no}</td><td class="l"><span class="sw" style="background:${color[(r.signing_date || "") + "|" + r.buyer]}">${r.signing_date || "–"}</span></td><td class="l">${r.buyer}</td><td class="l">${r.period}</td>
        <td>${nf(r.signed, 2)}</td><td>${nf(r.delivered, 2)}</td><td class="${r.undelivered > 0.005 ? "neg" : "zero"}">${nf(r.undelivered, 2)}</td><td>${nf(price(r), 4)}</td><td>${nf(r.amount, 2)}</td>
        <td class="l">${r.delivery_date}</td><td class="l">${r.amended_delivery}</td><td></td><td></td><td></td></tr>`; first = false; });
    const ex = yearExpired(y);      // the production whose GO have expired: one row, only the period and the production (marked expired) are filled
    if (ex != null) out += `<tr class="exp"><td></td><td></td><td></td><td></td><td class="l">${expiredLabel(y)}</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>${nf(ex, 2)} <span class="tag" style="margin-left:4px">expired</span></td><td></td><td></td></tr>`;
    const S = rs.reduce((a, r) => a + r.signed, 0), D = rs.reduce((a, r) => a + r.delivered, 0), A = rs.reduce((a, r) => a + r.amount, 0), P = y <= THIS_YEAR ? yearProd(y) : null;
    out += `<tr class="total"><td class="l" colspan="5">${y} total</td><td>${nf(S, 2)}</td><td>${nf(D, 2)}</td><td class="${S - D > 0.005 ? "neg" : "zero"}">${nf(S - D, 2)}</td><td>${nf(S ? rs.reduce((a, r) => a + price(r) * r.signed, 0) / S : null, 4)}</td><td>${nf(A, 2)}</td><td colspan="2"></td>${P == null ? "<td>–</td><td>–</td><td>–</td>" : `<td>${nf(P, 2)}${y === THIS_YEAR ? ' <span class="zero" style="font-weight:400">(to date)</span>' : ""}</td><td class="${cls(P - D)}">${sgn(P - D)}</td><td class="${cls(P - S)}">${sgn(P - S)}</td>`}</tr>`;
  });
  $("conTable").innerHTML = `<tr><th class="l">Year</th><th class="l">#</th><th class="l">Contract signed</th><th class="l">Buyer</th><th class="l">Production period</th><th>Signed GO (MWh)</th><th>Delivered (MWh)</th><th>Yet-to-be-delivered (MWh)</th><th>Unit price (EUR/MWh)</th><th>Amount (EUR)</th><th class="l">Delivery date</th><th class="l">Amended date</th><th title="Meter production of the five sites in the year (2024: Aug–Dec; current year: complete months to date; months whose GO have expired are left out)">Production (MWh)</th><th title="Production − Delivered of the year: GO in hand that can still be delivered">Available to deliver (MWh)</th><th title="Production − Signed GO of the year: GO not yet signed">Unsold GO (MWh)</th></tr>` + out;
}

async function init() {
  try { await loadAll(); } catch (e) { $("status").textContent = "Failed to load: " + e.message; return; }
  const ys = [...new Set(rows.map(r => r.year))].sort(), qy = URLQ.get("year");
  year = ys.includes(+qy) ? qy : "ALL";
  $("year").innerHTML = `<option value="ALL">All years</option>` + ys.map(y => `<option value="${y}">${y}</option>`).join("");
  $("year").value = year;
  $("year").onchange = () => { year = $("year").value; selDue = null; syncUrl({ year: year === "ALL" ? "" : year }); renderContracts(); renderDue(); };
  dmode = URLQ.get("dates") === "original" ? "original" : "amended"; $("dmode").value = dmode;
  $("dmode").onchange = () => { dmode = $("dmode").value; selDue = null; syncUrl({ year: year === "ALL" ? "" : year, dates: dmode === "original" ? "original" : "" }); renderDue(); renderContracts(); };
  renderContracts(); renderDue();
}
init();
</script>
</body>
</html>
