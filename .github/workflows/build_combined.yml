name: Build HU Combined Data
on:
  # 每天只跑一次（上游数据 workflow 的定时都在 UTC 06:00-09:20 之间）。
  # 需要立刻重建时用 Run workflow 手动触发。
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

# 只写 hu-market-data，不会提交到本仓库，所以不需要和其他数据 workflow 共用提交队列
concurrency:
  group: build-combined
  cancel-in-progress: false

env:
  DATA_REPO: hanyu-jian/hu-market-data

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install pandas

      - name: Check DATA_REPO_TOKEN
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::error::Secret DATA_REPO_TOKEN is not set (needs Contents read/write on $DATA_REPO)"
            exit 1
          fi

      - name: Build combined HU tables
        id: build
        run: python py/build/build_hu_combined.py --out build/combined

      - name: Check out data repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Commit and push to data repo
        working-directory: data-repo
        run: |
          cp ../build/combined/HU_*.csv .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add HU_*.csv
          git diff --cached --quiet || \
            git commit -m "chore: update combined HU data $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin HEAD
          git push

      # 把 /ops/imbalance 页面要用的三列价格（日前价 / ID3 / 不平衡价）也传到 R2（market/prices_HU_<年>.csv），Worker 直接读，不需要 GitHub token。
      # 放在推送之后、互相独立：这一步失败不影响 hu-market-data，hu-market-data 推送失败也不妨碍上传。
      # 需要网站仓库的 Actions 密钥 R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET（同超短期用的那个桶）。
      - name: Upload price table to R2 (for the ops Imbalance page)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          pip install boto3
          python py/build/upload_prices_to_r2.py --src build/combined
