<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Operations Capture Price</title>
<script src="/ops/nav.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; }
.container { max-width: 1600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); overflow: hidden; }

.sub-nav { background: #f8f9fa; border-bottom: 2px solid #e6e9ed; padding: 0 30px; display: flex; }
.sub-nav-link { display: inline-block; padding: 14px 22px; font-size: 14px; font-weight: 600; color: #6c757d; text-decoration: none;
  border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color .2s, border-color .2s; white-space: nowrap; cursor: pointer; }
.sub-nav-link:hover { color: #2c3e50; }
.sub-nav-link.active { color: #2c3e50; border-bottom-color: #2c3e50; }

.controls { padding: 20px 30px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; background: #fff; border-bottom: 1px solid #e6e9ed; }
.control-group { display: flex; flex-direction: column; gap: 6px; }
.control-group label { font-size: 13px; font-weight: 600; color: #2c3e50; white-space: nowrap; }
.control-group select, .control-group input[type=date] { font-family: inherit; height: 36px; padding: 0 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; color: #2c3e50; background: #fff; cursor: pointer; }
.control-group select { min-width: 120px; }
#fc { width: 250px; }
.btn-group-inline { display: flex; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; height: 36px; }
.btn-group-inline button { padding: 0 13px; font-size: 13px; font-family: inherit; font-weight: 500; background: #fff; border: none; border-right: 1px solid #ccc; cursor: pointer; color: #555; transition: background .15s, color .15s; white-space: nowrap; }
.btn-group-inline button:last-child { border-right: none; }
.btn-group-inline button:hover { background: #f0f2f5; color: #2c3e50; }
.btn-group-inline button.active { background: #2c3e50; color: #fff; }
.load-btn { height: 36px; padding: 0 22px; background: #2c3e50; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; }
.load-btn:hover { background: #1e2b38; }
.status { padding: 10px 30px 0; font-size: 13px; color: #888; min-height: 28px; }
.status.err { color: #e74c3c; }

.chart-grid { display: grid; grid-template-columns: 1fr; gap: 24px; padding: 24px 30px 30px; }
.chart-card { background: #fff; border-radius: 8px; border: 1px solid #e6e9ed; padding: 16px; }
.chart-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.chart-card-header h3 { font-size: 18px; font-weight: 500; color: #2c3e50; border-left: 4px solid #2c3e50; padding-left: 12px; margin: 0; line-height: 1.3; }
.chart-card-header .subtitle { font-size: 12px; color: #888; margin-top: 4px; padding-left: 16px; }
#chart { height: 440px; } #chart2 { height: 240px; }
.note { font-size: 12px; color: #888; line-height: 1.6; margin-top: 10px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #eef0f3; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { background: #f3f5f7; font-size: 12px; color: #4a5560; }
tr.total td { font-weight: 700; background: #fafbfc; }
.pos { color: #c0392b; } .neg { color: #27ae60; }

@media (max-width: 700px) {
  body { padding: 8px; }
  .controls { flex-direction: column; align-items: stretch; padding: 16px; }
  .chart-grid { padding: 16px; }
  .sub-nav { padding: 0 10px; overflow-x: auto; }
  .sub-nav-link { padding: 14px 14px; font-size: 13px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="sub-nav">
    <a class="sub-nav-link" href="/ops/overview">Overview</a>
    <a class="sub-nav-link active" href="/ops/capture-price">Capture Price</a>
  </div>
  <div class="chart-grid">
    <div class="chart-card">
      <div class="chart-card-header"><div><h3>Capture Price</h3><div class="subtitle">TOKAJ plants</div></div></div>
      <p class="note" style="font-size:14px;">Coming soon.</p>
    </div>
  </div>
</div>
</body>
</html>
