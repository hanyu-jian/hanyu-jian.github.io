name: Build HU Combined Data
on:
  workflow_run:
    workflows:
      - "Daily Energy Data Update"
      - "Daily EnAppSys (Montel) Update"
      - "Daily MAVIR Imbalance Price Update"
    types: [completed]
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

# 与其他数据 workflow 共用同一个提交队列，避免同时 push 冲突
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install pandas

      - name: Build combined HU tables
        run: python py/build_hu_combined.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/combined
          git diff --cached --quiet || \
            git commit -m "chore: update combined HU data $(date -u +'%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
