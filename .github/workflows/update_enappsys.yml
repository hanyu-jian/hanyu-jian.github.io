name: Daily EnAppSys IDA Update
on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:
    inputs:
      months_back:
        description: "Rolling months to download (1 = daily update; larger = backfill)"
        type: string
        default: "1"

permissions:
  contents: write

concurrency:
  group: enappsys-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch HUPX IDA1/2/3 from EnAppSys
        env:
          ENAPPSYS_USER: ${{ secrets.ENAPPSYS_USER }}
          ENAPPSYS_PASS: ${{ secrets.ENAPPSYS_PASS }}
          MONTHS_BACK: ${{ inputs.months_back || '1' }}
        run: python py/fetch_enappsys_ida.py --months-back "$MONTHS_BACK"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add private_data/enappsys
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: update EnAppSys HUPX IDA ($(date -u +%F))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
