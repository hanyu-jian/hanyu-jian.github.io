<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Operations GO</title>
<script src="/ops/nav.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; }
.container { max-width: 1600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); overflow: hidden; }
.sub-nav { background: #f8f9fa; border-bottom: 2px solid #e6e9ed; padding: 0 30px; display: flex; }
.sub-nav-link { display: inline-block; padding: 14px 22px; font-size: 14px; font-weight: 600; color: #6c757d; text-decoration: none;
  border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color .2s, border-color .2s; white-space: nowrap; cursor: pointer; }
.sub-nav-link:hover { color: #2c3e50; }
.sub-nav-link.active { color: #2c3e50; border-bottom-color: #2c3e50; }
.status { padding: 14px 30px 0; font-size: 13px; color: #e74c3c; min-height: 8px; }
.chart-grid { display: grid; grid-template-columns: 1fr; gap: 24px; padding: 14px 30px 30px; }
.chart-grid > * { min-width: 0; }
.chart-card { background: #fff; border-radius: 8px; border: 1px solid #e6e9ed; padding: 16px; }
.chart-card-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.chart-card-header h3 { font-size: 18px; font-weight: 500; color: #2c3e50; border-left: 4px solid #2c3e50; padding-left: 12px; margin: 0; line-height: 1.3; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 8px; text-align: right; border-bottom: 1px solid #eef0f3; white-space: nowrap; }
th.l, td.l { text-align: left; }
th { background: #f3f5f7; font-size: 12px; color: #4a5560; }
tr.total td { font-weight: 700; background: #fafbfc; }
tr.sub td { font-weight: 600; background: #fafbfc; color: #4a5560; font-size: 12px; }
.pos { color: #1e8449; font-weight: 600; } .neg { color: #d35400; font-weight: 600; } .zero { color: #888; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: #fdecea; color: #c0392b; margin-left: 6px; }
select { font-family: inherit; height: 36px; padding: 0 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; color: #2c3e50; background: #fff; cursor: pointer; }
.sw { display: inline-block; padding: 2px 8px; border-radius: 4px; }
@media (max-width: 700px) {
  body { padding: 8px; } .chart-grid { padding: 14px 16px 16px; }
  .sub-nav { padding: 0 10px; overflow-x: auto; } .sub-nav-link { padding: 14px 14px; font-size: 13px; }
}
</style>
</head>
<body>
<div class="container">

  <div class="sub-nav">
    <a class="sub-nav-link" href="/ops/overview">Overview</a>
    <a class="sub-nav-link" href="/ops/capture-price">Capture Price</a>
    <a class="sub-nav-link" href="/ops/imbalance">Imbalance</a>
    <a class="sub-nav-link active" href="/ops/go">GO</a>
  </div>

  <div class="status" id="status"></div>

  <div class="chart-grid">
    <div class="chart-card">
      <div class="chart-card-header"><h3>Contracts</h3><select id="year"></select></div>
      <div class="scroll"><table id="conTable"></table></div>
    </div>

    <div class="chart-card">
      <div class="chart-card-header"><h3>Undelivered GO</h3></div>
      <div class="scroll"><table id="dueTable"></table></div>
    </div>
  </div>
</div>

<script>
const SITES = ["Putnok", "Serenyfalva", "Sajokaza", "Szuhakálló 1", "Szuhakálló 2"];   // the five sites are always delivered together
const FIRST_YEAR = 2024;
const $ = id => document.getElementById(id);
const nf = (v, d = 0) => v == null || isNaN(v) ? "–" : v.toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: 0 });
const URLQ = new URLSearchParams(location.search);
function syncUrl(o) {
  try { const p = new URLSearchParams(); for (const [k, v] of Object.entries(o)) if (v != null && v !== "") p.set(k, v);
    const q = p.toString(); history.replaceState(null, "", location.pathname + (q ? "?" + q : "") + location.hash); } catch (e) { /* the address bar is only a convenience */ }
}
function budapestToday() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "Europe/Budapest", year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
const TODAY = budapestToday(), THIS_YEAR = +TODAY.slice(0, 4);
let rows = [], prod = {}, lastTs = {}, year = "ALL";

function parseCSV(text) {
  const out = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); out.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur || row.length) { row.push(cur); out.push(row); }
  const head = out.shift();
  return out.filter(r => r.length === head.length).map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
}
async function getText(url) {
  const r = await fetch(url, { credentials: "same-origin" });
  if (r.status === 404) return null;
  if (!r.ok) { let m = r.status; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
  return r.text();
}
// hourly meter CSV (Date, Meter [MWh], Meter [kWh]) → MWh per month; also remembers the last timestamp with a reading
function sumMonths(text, into, s) {
  const lines = text.split("\n");
  for (let i = 1; i < lines.length; i++) {
    const l = lines[i]; if (l.length < 20) continue;
    const c = l.split(","); if (c[1] === "" || c[1] === undefined) continue;
    const v = parseFloat(c[1]); if (isNaN(v)) continue;
    const m = +c[0].slice(5, 7) - 1;
    into[m] = (into[m] || 0) + v;
    if (c[0] > (lastTs[s] || "")) lastTs[s] = c[0];
  }
}
async function loadAll() {
  const yrs = []; for (let y = FIRST_YEAR; y <= THIS_YEAR; y++) yrs.push(y);
  const [salesText, ...meters] = await Promise.all([
    getText("/ops/api/go-sales"),
    ...SITES.flatMap(s => yrs.map(y => getText(`/ops/api/metered?site=${encodeURIComponent(s)}&year=${y}&resolution=hourly`).catch(e => { throw new Error(`${s} ${y}: ${e.message}`); }))),
  ]);
  if (salesText == null) throw new Error("GO sales file not found");
  rows = parseCSV(salesText).map(r => ({ ...r, year: +r.year, no: +r.trade_no, signed: +r.signed_mwh, delivered: +r.delivered_mwh, amount: +r.amount_eur }));
  rows.forEach(r => { r.undelivered = r.signed - r.delivered; r.due = r.amended_delivery || r.delivery_date; });
  prod = {}; lastTs = {};
  let k = 0;
  for (const s of SITES) { prod[s] = {}; for (const y of yrs) { const t = meters[k++]; if (t) { prod[s][y] = {}; sumMonths(t, prod[s][y], s); } } }
}

// production of the five sites in a year (MWh): months with a complete reading only, 2024 from August (the first month that was sold)
function monthProd(s, y, i) {
  const m = prod[s] && prod[s][y]; if (!m || m[i] == null) return null;
  if (y === 2024 && i < 7) return null;
  if (y === THIS_YEAR) {
    const t = lastTs[s]; if (t && +t.slice(0, 4) === y) {
      const mo = +t.slice(5, 7) - 1, day = +t.slice(8, 10), hr = +t.slice(11, 13);
      const full = day === new Date(Date.UTC(y, mo + 1, 0)).getUTCDate() && hr >= 23;
      if (i > mo || (i === mo && !full)) return null;
    }
  }
  return m[i];
}
function yearProd(y) { let a = 0, any = false; for (const s of SITES) for (let i = 0; i < 12; i++) { const v = monthProd(s, y, i); if (v != null) { a += v; any = true; } } return any ? a : null; }
const cls = v => v == null ? "" : Math.round(v) > 0 ? "pos" : Math.round(v) < 0 ? "neg" : "zero";
const sgn = v => { if (v == null) return "–"; const r = Math.round(v); return r === 0 ? "0" : (r > 0 ? "+" : "") + nf(r); };

// every row sits on its delivery date, or on the amended date when there is one
function dueMap() {
  const m = new Map();
  rows.forEach(r => { const o = m.get(r.due) || { date: r.due, sig: 0, del: 0, vol: 0, items: [] }; o.sig += r.signed; o.del += r.delivered; o.vol += r.undelivered; o.items.push(r); m.set(r.due, o); });
  return [...m.values()].sort((a, b) => a.date < b.date ? -1 : 1);
}
function renderDue() {
  const dues = dueMap();
  $("dueTable").innerHTML = `<tr><th class="l">Delivery date (amended date if any)</th><th>Signed GO (MWh)</th><th>Delivered GO (MWh)</th><th>Undelivered GO (MWh)</th><th class="l">Detail: rows of the Contracts table (Signed − Delivered)</th></tr>`
    + dues.map(d => `<tr><td class="l">${d.date}${d.date < TODAY && d.vol > 0.005 ? '<span class="tag">overdue</span>' : ""}</td><td>${nf(d.sig, 2)}</td><td>${nf(d.del, 2)}</td><td class="${d.vol > 0.005 ? "neg" : "zero"}">${nf(d.vol, 2)}</td>
        <td class="l" style="white-space:normal">${d.items.map(r => `<b>${r.year} #${r.no}</b> · ${r.buyer ? r.buyer + " · " : ""}${r.period}: ${nf(r.signed, 2)} − ${nf(r.delivered, 2)} = ${nf(r.undelivered, 2)}`).join("<br>")}</td></tr>`).join("");
}

const PALETTE = ["#dff3e3", "#d9ecf7", "#eceff1", "#dbe3fa", "#fff3c4", "#fde2e4", "#e8def8", "#fde8d0"];
function renderContracts() {
  const keys = []; rows.forEach(r => { const k = (r.signing_date || "") + "|" + r.buyer; if (!keys.includes(k)) keys.push(k); });
  const color = {}; keys.forEach((k, i) => { color[k] = k.startsWith("|") ? "#ffffff" : PALETTE[i % PALETTE.length]; });
  const price = r => r.signed ? r.amount / r.signed : null, years = [...new Set(rows.map(r => r.year))].sort(), shown = year === "ALL" ? years : [+year];
  let out = "", T = { S: 0, D: 0, A: 0, P: 0, anyP: false, S2: 0 };
  shown.forEach(y => {
    const rs = rows.filter(r => r.year === y); let first = true;
    rs.forEach(r => {
      out += `<tr><td class="l">${first ? y : ""}</td><td class="l">${r.no}</td><td class="l"><span class="sw" style="background:${color[(r.signing_date || "") + "|" + r.buyer]}">${r.signing_date || "–"}</span></td><td class="l">${r.buyer}</td><td class="l">${r.period}</td>
        <td>${nf(r.signed, 2)}</td><td>${nf(r.delivered, 2)}</td><td class="${r.undelivered > 0.005 ? "neg" : "zero"}">${nf(r.undelivered, 2)}</td><td>${nf(price(r), 4)}</td><td>${nf(r.amount, 2)}</td>
        <td class="l">${r.delivery_date}</td><td class="l">${r.amended_delivery}</td></tr>`; first = false; });
    const S = rs.reduce((a, r) => a + r.signed, 0), D = rs.reduce((a, r) => a + r.delivered, 0), A = rs.reduce((a, r) => a + r.amount, 0), p = y <= THIS_YEAR ? yearProd(y) : null, rem = p == null ? null : p - S;
    out += `<tr class="total"><td class="l" colspan="5">${y} total · annual production ${p == null ? "–" : nf(p, 2) + (y === THIS_YEAR ? " (to date)" : "")} · remaining unsold <span class="${cls(rem)}">${sgn(rem)}</span></td><td>${nf(S, 2)}</td><td>${nf(D, 2)}</td><td class="${S - D > 0.005 ? "neg" : "zero"}">${nf(S - D, 2)}</td><td>${nf(S ? A / S : null, 4)}</td><td>${nf(A, 2)}</td><td colspan="2"></td></tr>`;
  });
  $("conTable").innerHTML = `<tr><th class="l">Year</th><th class="l">#</th><th class="l">Contract signed</th><th class="l">Buyer</th><th class="l">Production period</th><th>Signed GO (MWh)</th><th>Delivered (MWh)</th><th>Undelivered (MWh)</th><th>Unit price (EUR/MWh)</th><th>Total amount (EUR)</th><th class="l">Delivery date</th><th class="l">Amended date</th></tr>` + out;
}

async function init() {
  try { await loadAll(); } catch (e) { $("status").textContent = "Failed to load: " + e.message; return; }
  const ys = [...new Set(rows.map(r => r.year))].sort(), qy = URLQ.get("year");
  year = ys.includes(+qy) ? qy : "ALL";
  $("year").innerHTML = `<option value="ALL">All years</option>` + ys.map(y => `<option value="${y}">${y}</option>`).join("");
  $("year").value = year;
  $("year").onchange = () => { year = $("year").value; syncUrl({ year: year === "ALL" ? "" : year }); renderContracts(); };
  renderContracts(); renderDue();
}
init();
</script>
</body>
</html>
