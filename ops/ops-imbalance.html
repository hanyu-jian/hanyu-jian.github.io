<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Operations Imbalance</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="/ops/nav.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; }
.container { max-width: 1600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); overflow: hidden; }

.sub-nav { background: #f8f9fa; border-bottom: 2px solid #e6e9ed; padding: 0 30px; display: flex; }
.sub-nav-link { display: inline-block; padding: 14px 22px; font-size: 14px; font-weight: 600; color: #6c757d; text-decoration: none;
  border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color .2s, border-color .2s; white-space: nowrap; cursor: pointer; }
.sub-nav-link:hover { color: #2c3e50; }
.sub-nav-link.active { color: #2c3e50; border-bottom-color: #2c3e50; }

.controls { padding: 20px 30px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; background: #fff; border-bottom: 1px solid #e6e9ed; }
.control-group { display: flex; flex-direction: column; gap: 6px; }
.control-group label { font-size: 13px; font-weight: 600; color: #2c3e50; white-space: nowrap; }
.control-group select, .control-group input[type=date] { font-family: inherit; height: 36px; padding: 0 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; color: #2c3e50; background: #fff; cursor: pointer; }
.control-group select { min-width: 120px; }
.btn-group-inline { display: flex; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; height: 36px; }
.btn-group-inline button { padding: 0 13px; font-size: 13px; font-family: inherit; font-weight: 500; background: #fff; border: none; border-right: 1px solid #ccc; cursor: pointer; color: #555; transition: background .15s, color .15s; white-space: nowrap; }
.btn-group-inline button:last-child { border-right: none; }
.btn-group-inline button:hover { background: #f0f2f5; color: #2c3e50; }
.btn-group-inline button.active { background: #2c3e50; color: #fff; }
.status { padding: 10px 30px 0; font-size: 13px; color: #888; min-height: 28px; }
.status.err { color: #e74c3c; }

.chart-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 24px 30px 30px; }
.chart-card { background: #fff; border-radius: 8px; border: 1px solid #e6e9ed; padding: 16px; }
.chart-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.chart-card-header h3 { font-size: 18px; font-weight: 500; color: #2c3e50; border-left: 4px solid #2c3e50; padding-left: 12px; margin: 0; line-height: 1.3; }
.chart-card-header .subtitle { font-size: 12px; color: #888; margin-top: 4px; padding-left: 16px; }
.slider-controls { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; margin-bottom: 8px; }
.slider-controls input[type=date] { font-family: inherit; height: 36px; padding: 0 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; color: #2c3e50; }
.slider-group { flex: 1; min-width: 320px; max-width: 760px; }
.slider-group input[type=range] { width: 100%; accent-color: #e67e22; }
.cover { font-size: 12px; color: #888; margin-left: 6px; font-weight: 400; }
.slider-ends { display: flex; justify-content: space-between; font-size: 12px; color: #888; }
.lead-badge { font-size: 14px; font-weight: 600; color: #e67e22; }
.slider-stats { font-size: 13px; color: #2c3e50; min-height: 22px; margin: 6px 0 2px; }
.note { font-size: 12px; color: #888; line-height: 1.6; margin-top: 10px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #eef0f3; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { background: #f3f5f7; font-size: 12px; color: #4a5560; }
tr.total td { font-weight: 700; background: #fafbfc; }
.pos { color: #c0392b; } .neg { color: #27ae60; }
th.hl { background: #ffe2b0; color: #7a4300; }
td.hl, tr.total td.hl, tr.sel td.hl, tr.out td.hl { background: #fff1d6; color: #9a4f00; font-weight: 700; }

@media (max-width: 900px) { .row2 { grid-template-columns: 1fr; } }
@media (max-width: 700px) {
  body { padding: 8px; }
  .controls { flex-direction: column; align-items: stretch; padding: 16px; }
  .chart-grid { padding: 16px; }
  .sub-nav { padding: 0 10px; overflow-x: auto; }
  .sub-nav-link { padding: 14px 14px; font-size: 13px; }
}

#chartRev { height: 540px; }
.banner { margin: 14px 30px 0; padding: 10px 14px; background: #fff8e6; border: 1px solid #f3dfa2; border-radius: 6px; font-size: 12.5px; color: #7a5c00; line-height: 1.6; }
td.dim { color: #aaa; }

.control-group input[type=text] { font-family: inherit; height: 36px; width: 110px; padding: 0 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; color: #2c3e50; }
tr.sel td { background: #f1f4ff; }
tr.out td { color: #aaa; }
.strategy { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; }
/* Strategy on the left of the chart: the controls are stacked and fill the card */
.work { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 24px; align-items: start; }
.work .strategy-card .chart-card-header { flex-direction: column; align-items: stretch; gap: 14px; margin-bottom: 0; }
.work .strategy { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 12px; align-items: end; }
.work .strategy .span2 { grid-column: 1 / -1; }
.work .strategy .control-group select, .work .strategy .control-group input[type=text] { width: 100%; min-width: 0; box-sizing: border-box; }
.work .strategy .control-group label { white-space: normal; }
.work .strategy .sec { grid-column: 1 / -1; font-size: 13px; font-weight: 700; color: #2c3e50; border-left: 3px solid #2c3e50; padding-left: 8px; line-height: 1.2; }
.work .strategy .sec:not(:first-child) { border-top: 1px solid #eef0f3; margin-top: 4px; padding-top: 14px; border-left: none; padding-left: 0; }
.work .strategy .sec:not(:first-child)::before { content: ""; display: inline-block; width: 3px; height: 13px; background: #2c3e50; margin-right: 8px; vertical-align: -2px; }
.work .strategy .secrow { display: flex; align-items: center; justify-content: space-between; }
.tog { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; font-weight: 600; color: #7b8794; }
.tog input { position: absolute; opacity: 0; pointer-events: none; }
.tog .track { position: relative; width: 36px; height: 20px; border-radius: 10px; background: #c9cfd6; transition: background .15s; }
.tog .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
.tog input:checked + .track { background: #2c3e50; }
.tog input:checked + .track::after { left: 18px; }
.tog input:checked ~ .tl { color: #2c3e50; }
.tog input:focus-visible + .track { outline: 2px solid #2c7fb8; outline-offset: 2px; }
.work .strategy .control-group.off { opacity: .45; }
.work .strategy .control-group select { padding: 0 8px; }
@media (max-width: 1000px) { .work { grid-template-columns: minmax(0, 1fr); } #chartRev { height: 420px; } }
/* drill-down */
.dd-grid { display: grid; grid-template-columns: 470px minmax(0, 1fr); gap: 24px; align-items: start; }
#chartDay { height: 820px; }
.dd-nav { height: 36px; width: 34px; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #2c3e50; font-size: 16px; cursor: pointer; }
.dd-nav:hover { background: #f0f2f5; }
.dd-day { display: flex; gap: 6px; align-items: center; }
.dd-sum { font-size: 13px; color: #2c3e50; line-height: 1.7; margin: 14px 0 10px; }
.dd-sum b { font-weight: 700; }
#ddRank tr.pick { cursor: pointer; } #ddRank tr.pick:hover td { background: #f6f8fa; } #ddRank tr.on td { background: #fff1d6; font-weight: 600; }
#ddRank th, #ddRank td, #ddTop th, #ddTop td { padding: 6px 8px; font-size: 12.5px; }
#ddRank th { white-space: normal; vertical-align: bottom; line-height: 1.25; }
@media (max-width: 1000px) { .dd-grid { grid-template-columns: minmax(0, 1fr); } #chartDay { height: 760px; } }
@media (max-width: 420px) { .work .strategy { grid-template-columns: minmax(0, 1fr); } }
</style>

<body>
<div class="container">

  <div class="sub-nav">
    <a class="sub-nav-link" href="/ops/overview">Overview</a>
    <a class="sub-nav-link" href="/ops/capture-price">Capture Price</a>
    <a class="sub-nav-link active" href="/ops/imbalance">Imbalance</a>
    <a class="sub-nav-link" href="/ops/go">GO</a>
  </div>

  <div class="controls">
    <div class="control-group"><label>Start date</label><input type="date" id="start"></div>
    <div class="control-group"><label>End date</label><input type="date" id="end"></div>
    <div class="control-group"><label>Frequency</label>
      <div class="btn-group-inline" id="freqGroup">
        <button data-f="15min" class="active">15 min</button><button data-f="hour">Hourly</button><button data-f="day">Daily</button><button data-f="week">Weekly</button><button data-f="month">Monthly</button><button data-f="quarter">Quarterly</button><button data-f="year">Yearly</button>
      </div></div>
  </div>
  <div class="status" id="status"></div>
  <div class="chart-grid">
    <div class="chart-card">
      <div class="chart-card-header" style="margin-bottom:0;align-items:center;">
        <div><h3>Site</h3></div>
        <div class="btn-group-inline" id="sites"></div>
      </div>
    </div>

  <div class="work">
    <div class="chart-card strategy-card">
      <div class="chart-card-header">
        <div><h3>Strategy</h3></div>
        <div class="strategy">
          <div class="sec secrow">Cloud
            <label class="tog" title="Off: the Bid values apply to every interval. On: cloudy intervals use the Cloud values, the others use Bid."><input type="checkbox" id="cloudOn"><span class="track"></span><span class="tl" id="cloudTl">Off</span></label>
          </div>
          <div class="control-group span2" id="gModel"><label>Cloud model</label><select id="cmodel"></select></div>
          <div class="control-group" id="gDaCc"><label>DA: cloud cover &gt; (%)</label><input type="text" inputmode="decimal" id="dacc" placeholder="off" autocomplete="off"></div>
          <div class="control-group" id="gDaBc"><label>DA: bid % when cloudy</label><input type="text" inputmode="decimal" id="dabc" placeholder="as Bid" autocomplete="off"></div>
          <div class="control-group" id="gIds"><label>IDC: cloud forecast</label><select id="ids"><option value="hist">Latest forecast</option><option value="day1">Day-ahead forecast</option></select></div>
          <div class="control-group" id="gIdl"><label>IDC: cloud layer</label><select id="idl"></select></div>
          <div class="control-group" id="gIdcc"><label>IDC: cloud cover &gt; (%)</label><input type="text" inputmode="decimal" id="idcc" placeholder="off" autocomplete="off"></div>
          <div class="control-group" id="gIdBc"><label>IDC: position % when cloudy</label><input type="text" inputmode="decimal" id="ibc" placeholder="as Bid" autocomplete="off"></div>
          <div class="sec">Bid</div>
          <div class="control-group"><label>DA bid, % of DA forecast</label><input type="text" inputmode="decimal" id="pct" value="100" autocomplete="off"></div>
          <div class="control-group"><label>IDC: position %</label><input type="text" inputmode="decimal" id="idbid" placeholder="off" autocomplete="off"></div>
          <div class="control-group span2" id="gMode"><label>Rest (not bid in DA)</label>
            <select id="mode"><option value="idc">Close out in IDC (rolling forecast)</option><option value="imb">Leave in imbalance</option></select></div>
          <div class="control-group span2"><label>IDC lead time</label><select id="lead"></select></div>
          <div class="sec">Curtailment</div>
          <div class="control-group span2"><label>Curtail when DA price &le; (EUR/MWh)</label><input type="text" inputmode="decimal" id="thr" placeholder="off" autocomplete="off"></div>
        </div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-card-header">
        <div><h3 id="revTitle">Revenue and total revenue</h3><div class="subtitle" id="revSub">EUR per period</div></div>
      </div>
      <div id="chartRev"></div>
    </div>
  </div>

    <div class="chart-card">
      <div class="chart-card-header" style="align-items:flex-end;">
        <div><h3 id="sumTitle">Summary table</h3><div class="subtitle" id="sumSub">EUR per month</div></div>
        <div class="strategy">
          <div class="control-group"><label>From month</label><select id="sumFrom" style="min-width:80px"></select></div>
          <div class="control-group"><label>To month</label><select id="sumTo" style="min-width:80px"></select></div>
        </div>
      </div>
      <div class="scroll"><table id="sumTable"></table></div>
    </div>

    <div class="chart-card" id="drill">
      <div class="chart-card-header" style="align-items:flex-end;">
        <div><h3 id="ddTitle">Imbalance cost drill-down</h3><div class="subtitle" id="ddSub">The days with the largest imbalance cost, and what happened in the intervals of one day</div></div>
        <div class="strategy">
          <div class="control-group"><label>Day (any day of the year)</label><div class="dd-day"><button class="dd-nav" id="ddPrev" title="Previous day">‹</button><input type="date" id="ddDay"><button class="dd-nav" id="ddNext" title="Next day">›</button></div></div>
        </div>
      </div>
      <div class="dd-grid">
        <div class="scroll"><table id="ddRank"></table></div>
        <div id="chartDay"></div>
      </div>
      <div class="dd-sum" id="ddSum"></div>
      <div class="scroll"><table id="ddTop"></table></div>
    </div>
  </div>
</div>

<script>
const SITES = ["Putnok", "Serenyfalva", "Sajokaza", "Szuhakálló 1", "Szuhakálló 2"];
const LEADS = [15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165, 180, 195, 210, 225, 240];
const DEFAULT_LEAD = 60, MIN_TRADABLE = 45, CHUNK_DAYS = 62, CONCURRENCY = 6;
const $ = id => document.getElementById(id);
// The selection is mirrored into the address bar (history.replaceState: no extra history entries) and restored from it when the page opens.
// A parameter that is missing or invalid is ignored and the default is used.
const URLQ = new URLSearchParams(location.search);
const qget = (k, ok) => { const v = URLQ.get(k); return v != null && ok(v) ? v : null; };
const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(Date.parse(v + "T00:00:00Z")) && new Date(v + "T00:00:00Z").toISOString().slice(0, 10) === v;
function syncUrl(o) {
  try { const p = new URLSearchParams(); for (const [k, v] of Object.entries(o)) if (v != null && v !== "") p.set(k, v);
    const q = p.toString(); history.replaceState(null, "", location.pathname + (q ? "?" + q : "") + location.hash); } catch (e) { /* the address bar is only a convenience */ }
}
const syncImb = () => syncUrl({ site: selected, start: $("start").value, end: $("end").value, freq, lead: $("lead").value, pct: $("pct").value.trim(), mode: $("mode").value, thr: $("thr").value.trim(), cloud: $("cloudOn").checked ? "1" : "", cm: $("cmodel").value, dacc: $("dacc").value.trim(), dabc: $("dabc").value.trim(), ibc: $("ibc").value.trim(), dd: ddPickedByUser ? ddDay : "", isrc: $("ids").value, il: $("idl").value.replace("cloud_cover", "").replace(/^_/, "") || "total", icc: $("idcc").value.trim(), ibid: $("idbid").value.trim(), from: $("sumFrom").value, to: $("sumTo").value });
let freq = "15min";

// <core>
// Settles one 15-minute interval. H = DA forecast, AH = theoretical production (kWh), F = UST forecast at the chosen lead (kWh or null),
// P / AA / PI = day-ahead / ID3 / imbalance price (EUR/MWh, null counts as 0), p = DA bid share (1 = 100%), mode = "idc" | "imb",
// thr = "no generation" price (EUR/MWh; null / undefined = off): when the DA price is below it nothing is generated, so there is no revenue,
// no imbalance cost and no payment to the PV plant for that interval.
// Fills out = [D, position, idc, daRevenue, idcRevenue, imbalanceRevenue, result, daOnlyRef, paymentToPlant, daOnlyProfit, curtailed(0/1)].
// paymentToPlant = AH * P / 1000 (energy generated x day-ahead price); profit of the trading company = result - paymentToPlant.
// kfDA / kfIDC = bid factors of a cloudy interval (1 = normal): kfDA scales the DA bid, kfIDC scales the final (IDC) position.
function settleSlot(H, AH, F, P, AA, PI, p, mode, out, thr, kfDA = 1, kfIDC = 1) {
  const priceKnown = P != null;
  P = P == null ? 0 : P; AA = AA == null ? 0 : AA; PI = PI == null ? 0 : PI;
  const ref = (P * H - (H - AH) * PI) / 1000;            // reference: 100% DA bid, nothing traded afterwards, no curtailment strategy
  out[7] = ref; out[9] = ref - AH * P / 1000;
  if (thr != null && priceKnown && P <= thr) { out[0] = out[1] = out[2] = out[3] = out[4] = out[5] = out[6] = out[8] = 0; out[10] = 1; return out; }
  const D = p * H * kfDA;
  const pos = mode === "idc" && F != null ? F * kfIDC : D;  // no UST forecast -> nothing is traded after the DA
  const idc = pos - D;
  const q = P * D / 1000, ae = AA * idc / 1000, imb = -(pos - AH) * PI / 1000;
  out[0] = D; out[1] = pos; out[2] = idc; out[3] = q; out[4] = ae; out[5] = imb; out[6] = q + ae + imb;
  out[8] = AH * P / 1000; out[10] = 0;
  return out;
}
// Imbalance % = imbalance cost / revenue prior to imbalance cost (DA + IDC revenue): the workbook's AQ / AF (negative = the imbalance eats that share of the revenue).
function profitPct(pay, profit) {                           // Profit / PV revenue (what the trading company earns per euro paid to the plants)
  return pay > 0 ? profit / pay * 100 : null;
}
function imbalancePct(daRevenue, idcRevenue, imbalanceCost) {
  const base = daRevenue + idcRevenue;
  return base ? imbalanceCost / base * 100 : null;
}
// </core>

let selected = "ALL", store = {}, loadSeq = 0, loadTimer = null, chRev;
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
function budapestToday() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "Europe/Budapest", year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
const nf = (v, d = 0) => v == null || !isFinite(v) ? "–" : v.toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const eur = v => v == null || !isFinite(v) ? "–" : (v < 0 ? "−" : "") + Math.abs(Math.round(v)).toLocaleString("en-US");
const sgn = (v, d = 0) => v == null || !isFinite(v) ? "–" : (v >= 0 ? "+" : "−") + Math.abs(v).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
function setStatus(t, err = false) { $("status").className = err ? "status err" : "status"; $("status").textContent = t; }
const numVal = id => { const v = $(id).value; return v === "" || !isFinite(+v) ? null : +v; };
const bidVal = (id, dflt = 1) => { const v = parseFloat($(id).value); return isFinite(v) ? Math.min(Math.max(v, 0), 150) / 100 : dflt; };
const cloudOn = () => $("cloudOn").checked;
const pctOrNull = id => numVal(id) == null ? null : Math.min(Math.max(numVal(id), 0), 150) / 100;
const idPosVal = () => numVal("idbid") == null ? null : Math.min(Math.max(numVal("idbid"), 0), 150) / 100;          // null = the IDC position is not adjusted: the Rest setting decides
const daCcVal = () => cloudOn() ? numVal("dacc") : null, idCcVal = () => cloudOn() ? numVal("idcc") : null;   // null = this cloud rule is not used
function syncEnabled() {                                      // grey out what has no effect: the cloud inputs while the switch is off, Rest while a normal IDC position is set
  const on = cloudOn(), pos = idPosVal() != null;
  $("cloudTl").textContent = on ? "On" : "Off";
  [["gModel", on], ["gDaCc", on], ["gDaBc", on], ["gIds", on], ["gIdl", on], ["gIdcc", on], ["gIdBc", on], ["gMode", !pos]].forEach(([g, act]) => { $(g).classList.toggle("off", !act); $(g).querySelectorAll("input,select").forEach(e => { e.disabled = !act; }); });
}
// Hourly cloud forecasts (%) per weather model, Budapest local time (data/weather/cloud_<model>_<source>.csv, listed in data/weather/models.json). Two sources (see the README):
//   day1 = forecast issued about 24 h before (used for the DA bid, total cloud cover only), hist = Historical Forecast (used for the IDC position, total / low / mid / high).
// Two areas: west = Putnok + Serenyfalva, east = Sajokaza + Szuhakálló 1 + 2.
const CLOUD_AREA = { "Putnok": "west", "Serenyfalva": "west", "Sajokaza": "east", "Szuhakálló 1": "east", "Szuhakálló 2": "east" };
const LAYER_LABEL = { cloud_cover: "Total", cloud_cover_low: "Low", cloud_cover_mid: "Mid", cloud_cover_high: "High" };
let MODELS = [{ id: "ifs025", label: "ECMWF IFS 0.25°", day1: { layers: ["cloud_cover"] } }];     // replaced by models.json
const cloud = {}, cloudState = {};                            // key "<model>|<source>": Map "YYYY-MM-DD HH" -> { column: % } once loaded; state "" | "loading" | "error"
const cm = () => $("cmodel").value || (MODELS[0] && MODELS[0].id);
const ckey = (src, model = cm()) => model + "|" + src;
const modelLabel = () => (MODELS.find(m => m.id === cm()) || {}).label || cm();
const modelLayers = src => { const m = MODELS.find(x => x.id === cm()); return ((m && m[src] && m[src].layers) || []).map(l => [l, LAYER_LABEL[l] || l]); };
async function ensureCloud(src) {
  const key = ckey(src), model = cm();
  if (cloud[key] || cloudState[key]) return;                  // already loaded, loading, or failed (reload the page to try again)
  cloudState[key] = "loading";
  try {
    const r = await fetch(`/ops/api/cloud?src=${src}&model=${encodeURIComponent(model)}`, { credentials: "same-origin" });
    if (!r.ok) throw new Error(r.status);

  const rows = ddDay ? dayDetail(sites, ddDay, stratCtx(p, mode)) : [];
  if (!rows.length) { $("ddSub").textContent = ddDay ? `${ddDay} · no data for this day (no theoretical production / DA forecast, or no prices yet)` : "No data"; $("ddSum").innerHTML = ""; $("ddTop").innerHTML = ""; if (chDay) chDay.clear(); return; }
  const x = rows.map(r => r.t.slice(11, 16)), tot = rows.reduce((a, r) => a + r.imb, 0), dev = rows.reduce((a, r) => a + (r.pos - r.AH), 0);
  const byDir = { neg: [0, 0], pos: [0, 0], na: [0, 0] };
  rows.forEach(r => { const k = r.SD == null ? "na" : r.SD <= 0 ? "neg" : "pos"; byDir[k][0]++; byDir[k][1] += r.imb; });
  const topI = rows.filter(r => r.imb !== 0).sort((a, b) => Math.abs(b.imb) - Math.abs(a.imb)).slice(0, 8);
  const topShare = tot ? topI.slice(0, 5).reduce((a, r) => a + r.imb, 0) / tot * 100 : null;
  $("ddSub").textContent = `${ddDay} · ${strategyText(p, mode, $("lead").value)}` + (byDir.na[0] === rows.length ? " · no system direction for this day (MAVIR data / price table)" : "");
  $("ddSum").innerHTML = `Imbalance cost of the day <b class="${tot < 0 ? "pos" : "neg"}">${eur(tot)} €</b> · imbalance <b>${eur(dev)} kWh</b> (${dev > 0 ? "bid more than produced" : dev < 0 ? "bid less than produced" : "even"})`
    + ` · system direction ≤ 0: ${byDir.neg[0]} intervals, <b>${eur(byDir.neg[1])} €</b> · system direction &gt; 0: ${byDir.pos[0]} intervals, <b>${eur(byDir.pos[1])} €</b>` + (byDir.na[0] ? ` · no direction: ${byDir.na[0]} intervals, ${eur(byDir.na[1])} €` : "")
    + (topShare == null ? "" : ` · the 5 largest intervals are ${nf(topShare, 0)}% of the day`);
  $("ddTop").innerHTML = `<tr><th>Interval</th><th>Theoretical kWh</th><th>DA bid kWh</th><th>Final position kWh</th><th>Imbalance kWh</th><th>DA price</th><th>Imbalance price</th><th>System direction MWh</th><th>Imbalance cost €</th></tr>`
    + topI.map(r => `<tr><td>${r.t.slice(11, 16)}</td><td>${nf(r.AH, 0)}</td><td>${nf(r.D, 0)}</td><td>${nf(r.pos, 0)}</td><td>${sgn(r.pos - r.AH, 0)}</td><td>${nf(r.P, 1)}</td><td>${nf(r.PI, 1)}</td><td>${sdTxt(r.SD)}</td><td><b>${eur(r.imb)}</b></td></tr>`).join("");
  if (!chDay) { chDay = echarts.init($("chartDay")); window.addEventListener("resize", () => chDay.resize()); }
  const num = v => v == null ? null : Math.round(v * 100) / 100;
  // four panels with a shared x axis; every panel has its own legend just above it
  const PANELS = [{ legend: 0.5, top: 9.5, h: 22 }, { legend: 34.5, top: 38, h: 10 }, { legend: 51, top: 54.5, h: 16.5 }, { legend: 74.5, top: 78, h: 13.5 }];
  const grid = k => ({ left: 64, right: 64, top: PANELS[k].top + "%", height: PANELS[k].h + "%" });
  const legend = (k, data) => ({ data, top: PANELS[k].legend + "%", left: "center", width: "78%", itemWidth: 14, itemHeight: 8, itemGap: 16, textStyle: { fontSize: 12 } });
  const xa = (k, show) => ({ type: "category", gridIndex: k, data: x, axisLabel: { show }, axisTick: { show }, axisPointer: { show: true } });
  const ya = (k, name, extra = {}) => ({ type: "value", gridIndex: k, name, nameGap: 8, nameTextStyle: { align: "left" }, splitNumber: 3, ...extra });
  // Panel 1: the gap between the DA bid and the theoretical production in two kinds of blocks, stacked on the theoretical production (all stacked values are positive:
  // ECharts does not stack a negative value on a positive one). Above it: red = final position above theoretical (bid more than produced), orange = what the IDC corrected on top of that.
  // Below it: orange = what the IDC corrected, green = final position below theoretical (bid less than produced).
  const mx = r => Math.max(r.pos, r.AH), mn = r => Math.min(r.pos, r.AH);
  const redV = rows.map(r => Math.max(r.pos - r.AH, 0)), orgUp = rows.map(r => Math.max(r.D, mx(r)) - mx(r));
  const orgDn = rows.map(r => Math.max(mn(r) - Math.min(r.D, r.AH), 0)), dnBase = rows.map((r, i) => mn(r) - orgDn[i]), grnV = rows.map(r => Math.max(r.AH - r.pos, 0));
  const OVER = "Imbalance: bid more", UNDER = "Imbalance: bid less", BAND = "IDC correction";
  const COL = { red: "rgba(217,83,79,.40)", grn: "rgba(76,175,110,.40)", org: "rgba(230,126,34,.35)" };
  const band = (name, stack, data, color, solid) => ({ name, type: "line", stack, xAxisIndex: 0, yAxisIndex: 0, data: data.map(num), symbol: "none", lineStyle: { width: 0, opacity: 0 }, itemStyle: { color: solid || "#999" }, areaStyle: color ? { color } : { opacity: 0 }, silent: true, z: 1 });
  const AHs = rows.map(r => r.AH);
  // the split of "DA bid − theoretical": corrected by the IDC (signed like the DA error) and the rest = final position − theoretical (the imbalance)
  const split = rows.map(r => { const e = r.D - r.AH, rr = r.pos - r.AH; return { cor: e >= 0 ? Math.max(e - Math.max(rr, 0), 0) : -Math.max(-e - Math.max(-rr, 0), 0), rr }; });
  // bars split by sign into two stacked series, so that each colour has its own legend entry
  const bars = (xi, yi, stack, defs) => defs.map(([name, color, f]) => ({ name, type: "bar", stack, xAxisIndex: xi, yAxisIndex: yi, data: rows.map(r => { const v = f(r); return v == null ? null : num(v); }), itemStyle: { color }, barMaxWidth: 8 }));
  const RED = "#d98880", GREEN = "#82c99b", BLUE = "#7fb3d5";
  const zeroAx = alignedZero(rows.map(r => r.PI), rows.map(r => r.SD));
  chDay.setOption({ animation: false,
    legend: [legend(0, ["Theoretical production", "DA bid", "Final position", BAND, OVER, UNDER]), legend(1, [BAND, OVER, UNDER]), legend(2, ["Imbalance price", "System direction ≤ 0", "System direction > 0"]), legend(3, ["Imbalance cost", "Imbalance income"])],
    axisPointer: { link: [{ xAxisIndex: "all" }] },
    tooltip: { trigger: "axis", axisPointer: { type: "line" }, formatter: ps => { const r = rows[ps[0].dataIndex]; return `<b>${r.t.slice(11, 16)}</b><br>Theoretical ${nf(r.AH, 0)} kWh · DA bid ${nf(r.D, 0)} · final position ${nf(r.pos, 0)}<br>Imbalance <b>${sgn(r.pos - r.AH, 0)} kWh</b><br>Imbalance price ${nf(r.PI, 1)} EUR/MWh<br>System direction ${sdTxt(r.SD)} MWh<br>Imbalance cost <b>${eur(r.imb)} €</b>${r.curt ? "<br>(curtailed)" : ""}`; } },
    grid: PANELS.map((_, k) => grid(k)),
    xAxis: [xa(0, false), xa(1, false), xa(2, false), xa(3, true)],
    yAxis: [ya(0, "kWh per 15 min", { min: 0 }), ya(1, "DA bid − theoretical, kWh"), ya(2, "EUR/MWh", { splitNumber: undefined, ...zeroAx[0] }), ya(2, "System direction, MWh", { position: "right", splitLine: { show: false }, nameTextStyle: { align: "right" }, splitNumber: undefined, ...zeroAx[1] }), ya(3, "Cost, EUR")],
    series: [
      band("baseUp", "up", AHs, null), band(OVER, "up", redV, COL.red, "#d98880"), band(BAND, "up", orgUp, COL.org, "#e6a15a"),
      band("baseDn", "dn", dnBase, null), band(BAND, "dn", orgDn, COL.org, "#e6a15a"), band(UNDER, "dn", grnV, COL.grn, "#82c99b"),
      { name: "Theoretical production", type: "line", xAxisIndex: 0, yAxisIndex: 0, data: rows.map(r => num(r.AH)), showSymbol: false, lineStyle: { width: 2.2, color: "#2c7fb8" }, itemStyle: { color: "#2c7fb8" }, z: 3 },
      { name: "DA bid", type: "line", xAxisIndex: 0, yAxisIndex: 0, data: rows.map(r => num(r.D)), showSymbol: false, lineStyle: { width: 1.6, color: "#95a5a6", type: "dashed" }, itemStyle: { color: "#95a5a6" }, z: 3 },
      { name: "Final position", type: "line", xAxisIndex: 0, yAxisIndex: 0, data: rows.map(r => num(r.pos)), showSymbol: false, lineStyle: { width: 2.2, color: "#e67e22" }, itemStyle: { color: "#e67e22" }, z: 3 },
      // Panel 2: DA bid − theoretical production per interval, stacked: what the IDC corrected (orange) + what is left in imbalance (red = bid more than produced, green = bid less)
      ...[[BAND, "#e6a15a", (r, i) => split[i].cor], [OVER, RED, (r, i) => Math.max(split[i].rr, 0)], [UNDER, GREEN, (r, i) => Math.min(split[i].rr, 0)]]
        .map(([name, color, f]) => ({ name, type: "bar", stack: "split", xAxisIndex: 1, yAxisIndex: 1, data: rows.map((r, i) => num(f(r, i))), itemStyle: { color }, barMaxWidth: 8 })),
      ...bars(2, 3, "sd", [["System direction ≤ 0", RED, r => (r.SD != null && r.SD <= 0 ? r.SD : null)], ["System direction > 0", BLUE, r => (r.SD != null && r.SD > 0 ? r.SD : null)]]),
      { name: "Imbalance price", type: "line", xAxisIndex: 2, yAxisIndex: 2, data: rows.map(r => num(r.PI)), showSymbol: false, lineStyle: { width: 2, color: "#2c3e50" }, itemStyle: { color: "#2c3e50" }, z: 3 },
      ...bars(3, 4, "cost", [["Imbalance cost", RED, r => (r.imb < 0 ? r.imb : null)], ["Imbalance income", GREEN, r => (r.imb >= 0 ? r.imb : null)]])] }, true);
}
// Any day can be picked. A day of another year: the page works on one calendar year, so it loads that year (the chart range moves to that day).
function pickDay(day) {
  if (!day || !isDate(day)) return;
  ddDay = day; ddPickedByUser = true;
  if (day.slice(0, 4) !== (dataYear || $("end").value.slice(0, 4))) { $("start").value = day; $("end").value = day; load(); return; }
  paint();
}
$("ddRank").addEventListener("click", e => { const tr = e.target.closest("tr[data-d]"); if (!tr) return; pickDay(tr.dataset.d); });

// ───────────── painting ─────────────
function paint() {
  syncImb();
  syncEnabled();
  if (daCcVal() != null) ensureCloud("day1");
  if (idCcVal() != null) ensureCloud($("ids").value);
  document.querySelectorAll("#sites button").forEach(b => b.classList.toggle("active", b.dataset.s === selected));
  if (!Object.keys(store).length) return;
  const sites = selected === "ALL" ? SITES : [selected], p = pctVal(), mode = $("mode").value;
  const name = selected === "ALL" ? "All sites" : selected, lead = $("lead").value;
  const rows = aggregate(sites, freq, p, mode);
  const lo = $("start").value, hi = $("end").value;
  const skipped = sites.reduce((n, s) => n + (store[s] ? [...store[s].skipDays].filter(d => d >= lo && d <= hi).length : 0), 0);
  const thr = thrVal(), thrTxt = thr == null ? "" : `, curtailed when DA price ≤ ${thr}`;
  const curt = rows.reduce((n, [, g]) => n + g.curt, 0), curtMWh = rows.reduce((n, [, g]) => n + g.curtAH, 0) / 1000;
  const dacc = daCcVal(), idcc = idCcVal(), isrc = $("ids").value;
  const cloudDA = rows.reduce((n, [, g]) => n + g.cloudDA, 0), cloudIDC = rows.reduce((n, [, g]) => n + g.cloudIDC, 0);
  const cloudNote = [[dacc, "day1", cloudDA, "DA"], [idcc, isrc, cloudIDC, "IDC"]].filter(([c]) => c != null)
    .map(([, src, n, nm]) => cloudState[ckey(src)] === "error" ? `cloud forecast data unavailable (${nm}, ${modelLabel()})` : cloudState[ckey(src)] === "loading" || !cloud[ckey(src)] ? `loading cloud forecast (${nm})` : `${nf(n)} cloudy intervals (${nm})`).join(" · ");
  const modeTxt = strategyText(p, mode, lead) + thrTxt;
  setStatus(rows.length ? `${name} · ${modeTxt}` + (thr != null ? ` · ${nf(curt)} intervals (${nf(curtMWh, 0)} MWh) curtailed` : "") + (cloudNote ? ` · ${cloudNote}` : "") + (skipped ? ` · ${skipped} site-days left out (no DA / imbalance price yet)` : "") + (loading ? ` · ${loading} (the rest of the year is still loading)` : "")
    : skipped ? `No data to show: all ${skipped} site-days in this period have no DA / imbalance price yet. Pick an earlier period, or check that the price table is up to date (the &ldquo;Build HU Combined Data&rdquo; workflow runs daily at 10:30 UTC).`
    : "No data for this selection.", !rows.length);
  $("revTitle").textContent = `${name} · revenue and total revenue`;
  $("revSub").textContent = `EUR per ${({ "15min": "15 minutes", hour: "hour", day: "day", week: "week", month: "month", quarter: "quarter", year: "year" })[freq]} · ${modeTxt}`;

  const x = rows.map(([k]) => k), many = x.length > 60;
  const bar = (nm, f, color) => ({ name: nm, type: "bar", stack: "rev", data: rows.map(([, g]) => Math.round(g[f] * 100) / 100), itemStyle: { color }, barMaxWidth: 28 });
  chRev.setOption({ animation: false, tooltip: { trigger: "axis", valueFormatter: v => v == null ? "–" : nf(v, 2) + " EUR" }, legend: { top: 4, selected: { "PV revenue": false } },
    grid: { left: 80, right: 24, top: 44, bottom: many ? 64 : 34 }, dataZoom: many ? [{ type: "inside" }, { type: "slider", height: 18, bottom: 6 }] : [{ type: "inside" }],
    xAxis: { type: "category", data: x, axisLabel: { formatter: v => freq === "15min" || freq === "hour" ? v.slice(5) : v } }, yAxis: { type: "value", name: "EUR", nameLocation: "end" },
    series: [ bar("DA revenue", "q", "#2c7fb8"), bar("IDC revenue", "ae", "#e67e22"), bar("Imbalance cost", "imb", "#d98b84"),
      { name: "PV revenue", type: "bar", stack: "rev", data: rows.map(([, g]) => -Math.round(g.pay * 100) / 100), itemStyle: { color: "#b9a37e" }, barMaxWidth: 28 },
      { name: "Total revenue", type: "line", data: rows.map(([, g]) => Math.round(g.res * 100) / 100), lineStyle: { width: 2.2, color: "#2c3e50" }, itemStyle: { color: "#2c3e50" }, showSymbol: x.length < 120, symbolSize: 5 },
      { name: "Profit", type: "line", data: rows.map(([, g]) => Math.round((g.res - g.pay) * 100) / 100), lineStyle: { width: 2.8, color: "#27ae60" }, itemStyle: { color: "#27ae60" }, showSymbol: x.length < 120, symbolSize: 5 },
    ] });
  summary(sites, p, mode);
  paintDrill(sites, p, mode);
}

// Summary table: January..December of the loaded year for the selected site(s) (the site buttons above), whatever dates the chart shows.
let lastSummary = null;
const redrawSummary = () => { syncImb(); if (lastSummary) { summary(...lastSummary); paintDrill(...lastSummary); } };
function summary(sites, p, mode) {
  lastSummary = [sites, p, mode];
  const year = (dataYear || $("end").value.slice(0, 4)), name = selected === "ALL" ? "All sites" : selected;
  const byMonth = new Map(aggregate(sites, "month", p, mode, false));
  const from = +$("sumFrom").value || 1, to = +$("sumTo").value || 12, full = from === 1 && to === 12;
  const picked = blank(), whole = blank(); let anyPicked = false, anyWhole = false;
  const cell = (g, f) => g ? eur(g[f]) : "–";
  const ipct = g => { const v = g ? imbalancePct(g.q, g.ae, g.imb) : null; return v == null ? "–" : sgn(v, 1) + "%"; };
  const ppct = g => { const v = g ? profitPct(g.pay, g.res - g.pay) : null; return v == null ? "–" : sgn(v, 1) + "%"; };
  const row = (label, g, cls = "") => `<tr class="${cls}"><td>${label}</td><td>${cell(g, "q")}</td><td>${cell(g, "ae")}</td><td>${g ? eur(g.q + g.ae) : "–"}</td><td>${cell(g, "imb")}</td><td><b>${cell(g, "res")}</b></td><td>${ipct(g)}</td><td>${cell(g, "pay")}</td><td><b>${g ? eur(g.res - g.pay) : "–"}</b></td><td class="hl">${ppct(g)}</td></tr>`;
  const rows = Array.from({ length: 12 }, (_, i) => {
    const m = i + 1, g = byMonth.get(`${year}-${String(m).padStart(2, "0")}`), inRange = m >= from && m <= to;
    if (g) { anyWhole = true; FIELDS.forEach(f => { whole[f] += g[f]; }); if (inRange) { anyPicked = true; FIELDS.forEach(f => { picked[f] += g[f]; }); } }
    return row(String(m), g, full ? "" : inRange ? "sel" : "out");
  });
  rows.push(row(full ? "Total 1–12" : from === to ? `Total ${from}` : `Total ${from}–${to}`, anyPicked ? picked : null, "total"));
  if (!full) rows.push(row("Total 1–12", anyWhole ? whole : null, "total"));
  $("sumTitle").textContent = `${name} · summary table`;
  const thr = thrVal();
  $("sumSub").textContent = `EUR per month, ${year} · ${strategyText(p, mode, $("lead").value)}${thr == null ? "" : `, curtailed when DA price ≤ ${thr}`}`
    + (loading ? " · the rest of the year is still loading" : "");
  $("sumTable").innerHTML = `<tr><th>Month</th><th>DA revenue €</th><th>IDC revenue €</th><th>Revenue (prior to imbalance cost) €</th><th>Imbalance cost €</th>
      <th>Total revenue (post imbalance cost) €</th><th>Imbalance %</th><th>PV revenue €</th><th>Profit (total revenue − PV revenue) €</th><th class="hl">Profit %</th></tr>` + rows.join("");
}
init();
</script>
