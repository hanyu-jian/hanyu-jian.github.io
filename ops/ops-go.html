<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Operations GO</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="/ops/nav.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; }
.container { max-width: 1600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); overflow: hidden; }
.sub-nav { background: #f8f9fa; border-bottom: 2px solid #e6e9ed; padding: 0 30px; display: flex; }
.sub-nav-link { display: inline-block; padding: 14px 22px; font-size: 14px; font-weight: 600; color: #6c757d; text-decoration: none;
  border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color .2s, border-color .2s; white-space: nowrap; cursor: pointer; }
.sub-nav-link:hover { color: #2c3e50; }
.sub-nav-link.active { color: #2c3e50; border-bottom-color: #2c3e50; }
.status { padding: 14px 30px 0; font-size: 13px; color: #e74c3c; min-height: 8px; }
.chart-grid { display: grid; grid-template-columns: 1fr; gap: 24px; padding: 14px 30px 30px; }
.chart-card { background: #fff; border-radius: 8px; border: 1px solid #e6e9ed; padding: 16px; }
.chart-card-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.chart-card-header h3 { font-size: 18px; font-weight: 500; color: #2c3e50; border-left: 4px solid #2c3e50; padding-left: 12px; margin: 0; line-height: 1.3; }
.btn-group-inline { display: flex; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; height: 36px; }
.btn-group-inline button { padding: 0 13px; font-size: 13px; font-family: inherit; font-weight: 500; background: #fff; border: none; border-right: 1px solid #ccc; cursor: pointer; color: #555; transition: background .15s, color .15s; white-space: nowrap; }
.btn-group-inline button:last-child { border-right: none; }
.btn-group-inline button:hover { background: #f0f2f5; color: #2c3e50; }
.btn-group-inline button.active { background: #2c3e50; color: #fff; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #eef0f3; white-space: nowrap; }
th, td.l { text-align: left; } th.r { text-align: right; }
th { background: #f3f5f7; font-size: 12px; color: #4a5560; }
th.grp { text-align: center; border-left: 1px solid #e0e4e8; background: #eaeef2; }
td.sep { border-left: 1px solid #e0e4e8; }
td.m { text-align: left; font-weight: 600; color: #2c3e50; }
td.merged { vertical-align: middle; background: #fafbfc; }
tr.total td { font-weight: 700; background: #fafbfc; }
.blk { font-size: 14px; font-weight: 600; color: #2c3e50; margin: 18px 0 8px; } .blk:first-of-type { margin-top: 0; }
.pos { color: #1e8449; font-weight: 600; } .neg { color: #d35400; font-weight: 600; } .zero { color: #888; }
td.blue { background: #e8f1fb; padding: 3px 6px; }
td.blue input { width: 120px; text-align: right; border: 1px solid #9ec3ea; background: #e8f1fb; border-radius: 4px; padding: 5px 8px; font: inherit; color: #1b4f8a; }
@media (max-width: 700px) {
  body { padding: 8px; } .chart-grid { padding: 14px 16px 16px; }
  .sub-nav { padding: 0 10px; overflow-x: auto; } .sub-nav-link { padding: 14px 14px; font-size: 13px; }
}
</style>
</head>
<body>
<div class="container">

  <div class="sub-nav">
    <a class="sub-nav-link" href="/ops/overview">Overview</a>
    <a class="sub-nav-link" href="/ops/capture-price">Capture Price</a>
    <a class="sub-nav-link" href="/ops/imbalance">Imbalance</a>
    <a class="sub-nav-link active" href="/ops/go">GO</a>
  </div>

  <div class="status" id="status"></div>

  <div class="chart-grid">
    <div class="chart-card">
      <div class="chart-card-header" style="margin-bottom:0"><div class="btn-group-inline" id="sites"></div></div>
    </div>

    <div class="chart-card">
      <div class="chart-card-header"><h3 id="titleA">GO sales</h3></div>
      <div class="blk">Transactions</div>
      <div class="scroll"><table id="ledTable"></table></div>
      <div class="blk">Annual summary</div>
      <div class="scroll"><table id="sumTable"></table></div>
    </div>

    <div class="chart-card">
      <div class="chart-card-header"><h3 id="titleB">Monthly balance</h3></div>
      <div class="scroll"><table id="monTable"></table></div>
    </div>
  </div>
</div>

<script>
const SITES = ["Putnok", "Serenyfalva", "Sajokaza", "Szuhakálló 1", "Szuhakálló 2"];
const CODE = { "Putnok": "ASTROPUT", "Serenyfalva": "ASTROSER", "Sajokaza": "ASTROKAZ", "Szuhakálló 1": "ASTROSZU", "Szuhakálló 2": "ASTROSZELES" };
const FIRST_YEAR = 2024, YEARS = [2024, 2025, 2026, 2027];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const $ = id => document.getElementById(id);
const nf = (v, d = 0, min = 0) => v == null || isNaN(v) ? "–" : v.toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: min });
const URLQ = new URLSearchParams(location.search);
function syncUrl(o) {
  try { const p = new URLSearchParams(); for (const [k, v] of Object.entries(o)) if (v != null && v !== "") p.set(k, v);
    const q = p.toString(); history.replaceState(null, "", location.pathname + (q ? "?" + q : "") + location.hash); } catch (e) { /* the address bar is only a convenience */ }
}
function budapestToday() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "Europe/Budapest", year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
const THIS_YEAR = +budapestToday().slice(0, 4);
let sales = [], prod = {}, lastTs = {}, site = "Putnok";

function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const head = rows.shift();
  return rows.filter(r => r.length === head.length).map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
}
async function getText(url) {
  const r = await fetch(url, { credentials: "same-origin" });
  if (r.status === 404) return null;
  if (!r.ok) { let m = r.status; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
  return r.text();
}
function sumMonths(text, into, s) {
  const lines = text.split("\n");
  for (let i = 1; i < lines.length; i++) {
    const l = lines[i]; if (l.length < 20) continue;
    const c = l.split(","); if (c[1] === "" || c[1] === undefined) continue;
    const v = parseFloat(c[1]); if (isNaN(v)) continue;
    const m = +c[0].slice(5, 7) - 1;
    into[m] = (into[m] || 0) + v;
    if (c[0] > (lastTs[s] || "")) lastTs[s] = c[0];
  }
}
async function loadAll() {
  const yrs = []; for (let y = FIRST_YEAR; y <= THIS_YEAR; y++) yrs.push(y);
  const [salesText, ...meters] = await Promise.all([
    getText("/ops/api/go-sales"),
    ...SITES.flatMap(s => yrs.map(y => getText(`/ops/api/metered?site=${encodeURIComponent(s)}&year=${y}&resolution=hourly`).catch(e => { throw new Error(`${s} ${y}: ${e.message}`); }))),
  ]);
  if (salesText == null) throw new Error("GO sales file not found");
  sales = parseCSV(salesText).map(r => ({ ...r, y: +r.production_year, m0: +r.start_month, m1: +r.end_month, vol: +r.volume_mwh, price: +r.price_eur_mwh, amt: +r.amount_eur }));
  prod = {}; lastTs = {};
  let k = 0;
  for (const s of SITES) { prod[s] = {}; for (const y of yrs) { const t = meters[k++]; if (t) { prod[s][y] = {}; sumMonths(t, prod[s][y], s); } } }
}

// metered MWh of one month, null when there is no complete reading (months before Aug 2024 are not part of the GO sales)
function monthProd(s, y, i) {
  const m = prod[s] && prod[s][y]; if (!m || m[i] == null) return null;
  if (y === 2024 && i < 7) return null;
  if (y === THIS_YEAR) {                      // a partly read month is not counted
    const t = lastTs[s]; if (t && +t.slice(0, 4) === y) {
      const mo = +t.slice(5, 7) - 1, day = +t.slice(8, 10), hr = +t.slice(11, 13);
      const full = day === new Date(Date.UTC(y, mo + 1, 0)).getUTCDate() && hr >= 23;
      if (i > mo || (i === mo && !full)) return null;
    }
  }
  return m[i];
}
const yearProd = (s, y) => { let a = 0, any = false; for (let i = 0; i < 12; i++) { const v = monthProd(s, y, i); if (v != null) { a += v; any = true; } } return any ? a : null; };
const rowsOf = (s, y) => sales.filter(r => r.site === s && r.y === y);
const cls = v => v == null ? "" : Math.round(v) > 0 ? "pos" : Math.round(v) < 0 ? "neg" : "zero";
const sgn = v => { if (v == null) return "–"; const r = Math.round(v); return r === 0 ? "0" : (r > 0 ? "+" : "") + nf(r); };
const rng = (r) => r.m0 === r.m1 ? MON[r.m0 - 1] : `${MON[r.m0 - 1]}–${MON[r.m1 - 1]}`;

// edited production cells are remembered in this browser only
const key = (s, y) => `go_prod_${s}_${y}`;
const stored = (s, y) => { try { const v = localStorage.getItem(key(s, y)); return v == null || v === "" ? null : +v; } catch (e) { return null; } };
const store = (s, y, v) => { try { v === "" ? localStorage.removeItem(key(s, y)) : localStorage.setItem(key(s, y), v); } catch (e) {} };

function renderLedger() {
  const rows = sales.filter(r => r.site === site);
  $("titleA").textContent = `${site} · ${CODE[site]}`;
  $("ledTable").innerHTML = `<tr><th>Year</th><th>Production period</th><th>Buyer</th><th class="r">Volume (MWh)</th><th class="r">Price (EUR/MWh)</th><th class="r">Amount (EUR)</th><th>Delivery date</th><th>Delivery to be amended</th><th>Note</th></tr>`
    + rows.map(r => `<tr><td class="l">${r.y}</td><td class="l">${r.period}</td><td class="l">${r.buyer || ""}</td><td>${nf(r.vol, 2)}</td><td>${nf(r.price, 4)}</td><td>${nf(r.vol * r.price, 2)}</td>
      <td class="l">${r.delivery_date}</td><td class="l">${r.amended_delivery}</td><td class="l" style="white-space:normal;min-width:240px;color:#888;font-size:12px">${r.note}</td></tr>`).join("");
}

function renderSummary() {
  let tS = 0, tA = 0, tP = 0, tR = 0, anyP = false;
  const body = YEARS.map(y => {
    const rs = rowsOf(site, y), sold = rs.reduce((a, r) => a + r.vol, 0), amt = rs.reduce((a, r) => a + r.vol * r.price, 0);
    const auto = y <= THIS_YEAR ? yearProd(site, y) : null, ed = stored(site, y), p = ed != null ? ed : auto;
    tS += sold; tA += amt;
    let rem = null; if (p != null) { rem = p - sold; tP += p; tR += rem; anyP = true; }
    return `<tr><td class="l">${y}</td><td>${nf(sold, 2)}</td><td>${nf(amt, 2)}</td><td>${nf(sold ? amt / sold : null, 4)}</td>
      <td class="blue"><input type="number" step="any" data-y="${y}" value="${p == null ? "" : Math.round(p * 100) / 100}" placeholder="–"></td><td class="${cls(rem)}">${sgn(rem)}</td></tr>`;
  }).join("");
  $("sumTable").innerHTML = `<tr><th>Year</th><th class="r">Sold (MWh)</th><th class="r">Amount (EUR)</th><th class="r">Avg price (EUR/MWh)</th><th class="r">Production (MWh)</th><th class="r">Remaining (MWh)</th></tr>` + body
    + `<tr class="total"><td class="l">Total</td><td>${nf(tS, 2)}</td><td>${nf(tA, 2)}</td><td>${nf(tS ? tA / tS : null, 4)}</td><td>${anyP ? nf(tP, 2) : "–"}</td><td class="${cls(anyP ? tR : null)}">${anyP ? sgn(tR) : "–"}</td></tr>`;
  $("sumTable").querySelectorAll("input").forEach(inp => inp.onchange = () => { store(site, +inp.dataset.y, inp.value); renderSummary(); });
}

// month rows 1–12: the sold volume sits on the month for monthly sales, and is merged over Jan–Jun / Jul–Dec for half-year contracts
function renderMonths() {
  $("titleB").textContent = `${site} · monthly balance`;
  const per = YEARS.map(y => {
    const rs = rowsOf(site, y), seg = {}, fy = rs.filter(r => r.m0 === 1 && r.m1 === 12).reduce((a, r) => a + r.vol, 0);
    rs.filter(r => !(r.m0 === 1 && r.m1 === 12)).forEach(r => { const k = r.m0 + "-" + r.m1; (seg[k] = seg[k] || { m0: r.m0, m1: r.m1, sold: 0 }).sold += r.vol; });
    const at = {}; Object.values(seg).forEach(g => { at[g.m0] = g; });
    const covered = new Set(); Object.values(seg).forEach(g => { for (let m = g.m0 + 1; m <= g.m1; m++) covered.add(m); });
    return { y, at, covered, fy, sold: rs.reduce((a, r) => a + r.vol, 0) };
  });
  const head = `<tr><th rowspan="2">Month</th>${YEARS.map(y => `<th class="grp" colspan="3">${y}</th>`).join("")}</tr>
    <tr>${YEARS.map(() => `<th class="r sep">Production</th><th class="r">Sold</th><th class="r">Remaining</th>`).join("")}</tr>`;
  const body = MON.map((mn, i) => {
    const m = i + 1;
    return `<tr><td class="m">${mn}</td>` + per.map(P => {
      const p = P.y <= THIS_YEAR ? monthProd(site, P.y, i) : null;
      const pc = `<td class="sep">${nf(p, 0)}</td>`;
      if (P.covered.has(m)) return pc;
      const g = P.at[m];
      if (!g) return pc + `<td>–</td><td>–</td>`;
      const span = g.m1 - g.m0 + 1; let tp = null;
      for (let k = g.m0 - 1; k < g.m1; k++) { const v = P.y <= THIS_YEAR ? monthProd(site, P.y, k) : null; if (v != null) tp = (tp || 0) + v; }
      const rem = tp == null ? null : tp - g.sold;
      return pc + `<td class="merged" rowspan="${span}">${nf(g.sold, 2)}</td><td class="merged ${cls(rem)}" rowspan="${span}">${sgn(rem)}</td>`;
    }).join("") + `</tr>`;
  }).join("");
  const fyRow = `<tr><td class="m">Q1–Q4</td>${per.map(P => `<td class="sep">–</td><td>${P.fy ? nf(P.fy, 2) : "–"}</td><td>–</td>`).join("")}</tr>`;
  const tot = `<tr class="total"><td class="l">Total</td>${per.map(P => { const p = P.y <= THIS_YEAR ? yearProd(site, P.y) : null, rem = p == null ? null : p - P.sold;
    return `<td class="sep">${nf(p, 0)}</td><td>${nf(P.sold, 2)}</td><td class="${cls(rem)}">${sgn(rem)}</td>`; }).join("")}</tr>`;
  $("monTable").innerHTML = head + body + fyRow + tot;
}

function renderAll() {
  syncUrl({ site: site === "Putnok" ? "" : site });
  [...$("sites").children].forEach(b => b.classList.toggle("active", b.dataset.v === site));
  renderLedger(); renderSummary(); renderMonths();
}
async function init() {
  try { await loadAll(); } catch (e) { $("status").textContent = "Failed to load: " + e.message; return; }
  const q = URLQ.get("site"); if (SITES.includes(q)) site = q;
  $("sites").innerHTML = SITES.map(s => `<button data-v="${s}">${s}</button>`).join("");
  $("sites").onclick = e => { const b = e.target.closest("button"); if (b) { site = b.dataset.v; renderAll(); } };
  renderAll();
}
init();
</script>
</body>
</html>
