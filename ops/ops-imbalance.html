<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Operations Imbalance</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="/ops/nav.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; }
.container { max-width: 1600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); overflow: hidden; }

.sub-nav { background: #f8f9fa; border-bottom: 2px solid #e6e9ed; padding: 0 30px; display: flex; }
.sub-nav-link { display: inline-block; padding: 14px 22px; font-size: 14px; font-weight: 600; color: #6c757d; text-decoration: none;
  border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color .2s, border-color .2s; white-space: nowrap; cursor: pointer; }
.sub-nav-link:hover { color: #2c3e50; }
.sub-nav-link.active { color: #2c3e50; border-bottom-color: #2c3e50; }

.controls { padding: 20px 30px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; background: #fff; border-bottom: 1px solid #e6e9ed; }
.control-group { display: flex; flex-direction: column; gap: 6px; }
.control-group label { font-size: 13px; font-weight: 600; color: #2c3e50; white-space: nowrap; }
.control-group select, .control-group input[type=date] { font-family: inherit; height: 36px; padding: 0 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; color: #2c3e50; background: #fff; cursor: pointer; }
.control-group select { min-width: 120px; }
.btn-group-inline { display: flex; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; height: 36px; }
.btn-group-inline button { padding: 0 13px; font-size: 13px; font-family: inherit; font-weight: 500; background: #fff; border: none; border-right: 1px solid #ccc; cursor: pointer; color: #555; transition: background .15s, color .15s; white-space: nowrap; }
.btn-group-inline button:last-child { border-right: none; }
.btn-group-inline button:hover { background: #f0f2f5; color: #2c3e50; }
.btn-group-inline button.active { background: #2c3e50; color: #fff; }
.status { padding: 10px 30px 0; font-size: 13px; color: #888; min-height: 28px; }
.status.err { color: #e74c3c; }

.chart-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 24px 30px 30px; }
.chart-card { background: #fff; border-radius: 8px; border: 1px solid #e6e9ed; padding: 16px; }
.chart-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.chart-card-header h3 { font-size: 18px; font-weight: 500; color: #2c3e50; border-left: 4px solid #2c3e50; padding-left: 12px; margin: 0; line-height: 1.3; }
.chart-card-header .subtitle { font-size: 12px; color: #888; margin-top: 4px; padding-left: 16px; }
.slider-controls { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; margin-bottom: 8px; }
.slider-controls input[type=date] { font-family: inherit; height: 36px; padding: 0 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; color: #2c3e50; }
.slider-group { flex: 1; min-width: 320px; max-width: 760px; }
.slider-group input[type=range] { width: 100%; accent-color: #e67e22; }
.cover { font-size: 12px; color: #888; margin-left: 6px; font-weight: 400; }
.slider-ends { display: flex; justify-content: space-between; font-size: 12px; color: #888; }
.lead-badge { font-size: 14px; font-weight: 600; color: #e67e22; }
.slider-stats { font-size: 13px; color: #2c3e50; min-height: 22px; margin: 6px 0 2px; }
.note { font-size: 12px; color: #888; line-height: 1.6; margin-top: 10px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #eef0f3; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { background: #f3f5f7; font-size: 12px; color: #4a5560; }
tr.total td { font-weight: 700; background: #fafbfc; }
.pos { color: #c0392b; } .neg { color: #27ae60; }

@media (max-width: 900px) { .row2 { grid-template-columns: 1fr; } }
@media (max-width: 700px) {
  body { padding: 8px; }
  .controls { flex-direction: column; align-items: stretch; padding: 16px; }
  .chart-grid { padding: 16px; }
  .sub-nav { padding: 0 10px; overflow-x: auto; }
  .sub-nav-link { padding: 14px 14px; font-size: 13px; }
}

#chartRev { height: 400px; }
.banner { margin: 14px 30px 0; padding: 10px 14px; background: #fff8e6; border: 1px solid #f3dfa2; border-radius: 6px; font-size: 12.5px; color: #7a5c00; line-height: 1.6; }
tr.sel td { background: #f1f4ff; font-weight: 600; }
th.grp { text-align: center; border-left: 1px solid #dfe3e8; border-right: 1px solid #dfe3e8; }
td.l, th.l { border-left: 1px solid #eef0f3; }
td.dim { color: #aaa; }

.control-group input[type=number] { font-family: inherit; height: 36px; width: 110px; padding: 0 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; color: #2c3e50; }
.strategy { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; }
.best { font-size: 13px; color: #2c3e50; margin: 4px 0 8px; line-height: 1.7; }
.best b.i { color: #e67e22; } .best b.m { color: #6c7a89; }
</style>
</head>
<body>
<div class="container">

  <div class="sub-nav">
    <a class="sub-nav-link" href="/ops/overview">Overview</a>
    <a class="sub-nav-link" href="/ops/capture-price">Capture Price</a>
    <a class="sub-nav-link active" href="/ops/imbalance">Imbalance</a>
  </div>

  <div class="controls">
    <div class="control-group"><label>Start date</label><input type="date" id="start"></div>
    <div class="control-group"><label>End date</label><input type="date" id="end"></div>
    <div class="control-group"><label>Frequency</label>
      <div class="btn-group-inline" id="freqGroup">
        <button data-f="15min" class="active">15 min</button><button data-f="hour">Hourly</button><button data-f="day">Daily</button><button data-f="week">Weekly</button><button data-f="month">Monthly</button><button data-f="quarter">Quarterly</button><button data-f="year">Yearly</button>
      </div></div>
  </div>
  <div class="status" id="status"></div>
  <div class="chart-grid">
    <div class="chart-card">
      <div class="chart-card-header" style="margin-bottom:0;align-items:center;">
        <div><h3>Site</h3></div>
        <div class="btn-group-inline" id="sites"></div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-card-header" style="margin-bottom:0;align-items:flex-end;">
        <div><h3>Strategy</h3></div>
        <div class="strategy">
          <div class="control-group"><label>DA bid, % of DA forecast</label><input type="number" id="pct" min="0" max="150" step="5" value="100"></div>
          <div class="control-group"><label>Rest (not bid in DA)</label>
            <select id="mode"><option value="idc">Close out in IDC (rolling forecast)</option><option value="imb">Leave in imbalance</option></select></div>
          <div class="control-group"><label>IDC lead time</label><select id="lead"></select></div>
        </div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-card-header">
        <div><h3 id="revTitle">Revenue and total revenue</h3><div class="subtitle" id="revSub">EUR per period</div></div>
      </div>
      <div id="chartRev"></div>
    </div>

    <div class="chart-card">
      <div class="chart-card-header">
        <div><h3 id="sumTitle">Summary table</h3><div class="subtitle" id="sumSub">EUR per month</div></div>
      </div>
      <div class="scroll"><table id="sumTable"></table></div>
    </div>

    <div class="chart-card">
      <div class="chart-card-header">
        <div><h3 id="sensTitle">Sensitivity to the DA bid share</h3><div class="subtitle">EUR, selected sites and dates</div></div>
      </div>
      <div class="best" id="best"></div>
      <div class="scroll"><table id="sensTable"></table></div>
    </div>

  </div>
</div>

<script>
const SITES = ["Putnok", "Serenyfalva", "Sajokaza", "Szuhakálló 1", "Szuhakálló 2"];
const LEADS = [15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165, 180, 195, 210, 225, 240];
const DEFAULT_LEAD = 60, MIN_TRADABLE = 45, CHUNK_DAYS = 62, CONCURRENCY = 6;
const $ = id => document.getElementById(id);
let freq = "15min";

// <core>
// Settles one 15-minute interval. H = DA forecast, AH = theoretical production (kWh), F = UST forecast at the chosen lead (kWh or null),
// P / AA / PI = day-ahead / ID3 / imbalance price (EUR/MWh, null counts as 0), p = DA bid share (1 = 100%), mode = "idc" | "imb".
// Fills out = [D, position, idc, daRevenue, idcRevenue, imbalanceRevenue, result, daOnlyRef].
function settleSlot(H, AH, F, P, AA, PI, p, mode, out) {
  P = P == null ? 0 : P; AA = AA == null ? 0 : AA; PI = PI == null ? 0 : PI;
  const D = p * H;
  const pos = mode === "idc" && F != null ? F : D;      // no UST forecast -> nothing is traded after the DA
  const idc = pos - D;
  const q = P * D / 1000, ae = AA * idc / 1000, imb = -(pos - AH) * PI / 1000;
  out[0] = D; out[1] = pos; out[2] = idc; out[3] = q; out[4] = ae; out[5] = imb; out[6] = q + ae + imb;
  out[7] = (P * H - (H - AH) * PI) / 1000;               // reference: 100% DA bid, nothing traded afterwards
  return out;
}
// </core>

let selected = "ALL", store = {}, loadSeq = 0, loadTimer = null, chRev;
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
function budapestToday() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "Europe/Budapest", year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
const nf = (v, d = 0) => v == null || !isFinite(v) ? "–" : v.toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const eur = v => v == null || !isFinite(v) ? "–" : (v < 0 ? "−" : "") + Math.abs(Math.round(v)).toLocaleString("en-US");
const sgn = (v, d = 0) => v == null || !isFinite(v) ? "–" : (v >= 0 ? "+" : "−") + Math.abs(v).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
function setStatus(t, err = false) { $("status").className = err ? "status err" : "status"; $("status").textContent = t; }
const pctVal = () => { const v = parseFloat($("pct").value); return isFinite(v) ? Math.min(Math.max(v, 0), 150) / 100 : 1; };

function defaultRange() {                                    // the three days before today (prices and theoretical production are complete)
  const t = budapestToday(); $("start").value = addDays(t, -3); $("end").value = addDays(t, -1);
}
function scheduleLoad(delay = 250) { clearTimeout(loadTimer); loadTimer = setTimeout(load, delay); }
// The page works on one calendar year (the year of the end date), loaded once: changing the dates inside that year only repaints.
function scheduleRefresh(delay = 250) {
  clearTimeout(loadTimer);
  loadTimer = setTimeout(() => { const e = $("end").value; (e && e.slice(0, 4) !== dataYear) ? load() : (checkRange() && paint()); }, delay);
}
function checkRange() {
  const s = $("start").value, e = $("end").value;
  if (!s || !e) { setStatus("Pick a start and an end date.", true); return false; }
  if (e < s) { setStatus("End date is before the start date.", true); return false; }
  if (s.slice(0, 4) !== e.slice(0, 4)) $("start").value = e.slice(0, 4) + "-01-01";      // one calendar year at a time
  return true;
}

function init() {
  $("lead").innerHTML = LEADS.map(h => `<option value="${h}"${h === DEFAULT_LEAD ? " selected" : ""}>${h} min${h === DEFAULT_LEAD ? " (default)" : h === MIN_TRADABLE ? " (shortest tradable)" : h < MIN_TRADABLE ? " (not tradable)" : ""}</option>`).join("");
  $("sites").innerHTML = ["ALL", ...SITES].map(s => `<button data-s="${s}">${s === "ALL" ? "All sites" : s}</button>`).join("");
  $("sites").onclick = e => { const b = e.target.closest("button"); if (!b) return; selected = b.dataset.s; paint(); };
  $("freqGroup").addEventListener("click", e => {
    const b = e.target.closest("button[data-f]"); if (!b) return;
    freq = b.dataset.f; document.querySelectorAll("#freqGroup button").forEach(x => x.classList.toggle("active", x === b)); paint();
  });
  $("lead").onchange = () => scheduleLoad();
  // The page works on one calendar year: moving one date into another year moves the other date into that year too.
  $("start").onchange = () => {
    const st = $("start").value, en = $("end").value;
    if (st && (!en || st.slice(0, 4) !== en.slice(0, 4))) { const t = budapestToday(), last = [st.slice(0, 4) + "-12-31", addDays(st, 29)].sort()[0]; $("end").value = last > t && st <= t ? t : last; }
    scheduleRefresh();
  };
  $("end").onchange = () => {
    const st = $("start").value, en = $("end").value;
    if (en && (!st || st.slice(0, 4) !== en.slice(0, 4))) $("start").value = en.slice(0, 4) + "-01-01";
    scheduleRefresh();
  };
  $("mode").onchange = paint;
  $("pct").oninput = paint;
  chRev = echarts.init($("chartRev"));
  window.addEventListener("resize", () => chRev.resize());
  defaultRange(); load();
}

// ───────────── loading: 62-day chunks per site, at most CONCURRENCY requests at a time ─────────────
async function fetchChunk(site, a, b, lead) {
  const r = await fetch(`/ops/api/imbalance?site=${encodeURIComponent(site)}&start=${a}&end=${b}&lead=${lead}`, { credentials: "same-origin" });
  if (r.status === 401) { location.href = "/ops/login?next=" + encodeURIComponent(location.pathname); throw new Error("Session expired"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(`${site}: ${j.error || r.status}`);
  return j;
}
let dataYear = null, loading = "";
async function load() {
  const seq = ++loadSeq, lead = $("lead").value;
  if (!checkRange()) return;
  const s = $("start").value, e = $("end").value, year = e.slice(0, 4);
  const from = year + "-01-01", to = [year + "-12-31", budapestToday()].sort()[0];
  const jobs = [];
  for (const site of SITES) for (let a = from; a <= to; a = addDays(a, CHUNK_DAYS)) { const b = addDays(a, CHUNK_DAYS - 1); jobs.push({ site, a, b: b > to ? to : b }); }
  // the chunks that overlap the selected dates come first, so the chart can be drawn before the rest of the year has arrived
  const near = j => j.a <= e && j.b >= s;
  jobs.sort((x, y) => (near(y) - near(x)) || (x.a < y.a ? -1 : x.a > y.a ? 1 : 0));
  const firstBatch = jobs.filter(near).length;
  dataYear = null; loading = `Loading ${year}: 0 / ${jobs.length}…`; setStatus(loading);
  let next = 0, done = 0; const results = [];
  const build = () => {
    store = {};
    results.slice().sort((x, y) => x.job.site === y.job.site ? (x.job.a < y.job.a ? -1 : 1) : 0).forEach(({ job, j }) => {
      const o = store[job.site] || (store[job.site] = { t: [], H: [], AH: [], F: [], P: [], AA: [], PI: [] });
      Object.keys(o).forEach(k => o[k].push(...j[k]));
    });
    Object.values(store).forEach(markSkipped);
  };
  try {
    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, jobs.length) }, async () => {
      while (next < jobs.length) {
        const job = jobs[next++]; const j = await fetchChunk(job.site, job.a, job.b, lead);
        if (seq !== loadSeq) return;
        results.push({ job, j }); done++;
        loading = `Loading ${year}: ${done} / ${jobs.length}…`;
        if (done === firstBatch && done < jobs.length) { build(); paint(); }       // the selected period is complete: draw it now
        else if (done < jobs.length) setStatus(loading + " (the rest of the year is still loading)");
      }
    }));
    if (seq !== loadSeq) return;
    build(); dataYear = year; loading = ""; paint();
  } catch (err) {
    if (seq === loadSeq) { loading = ""; setStatus("Failed to load: " + err.message, true); }
  }
}
// Days without any DA price or without any imbalance price (usually the newest days) are left out of every figure.
function markSkipped(o) {
  const days = new Map();
  o.t.forEach((t, i) => { const d = t.slice(0, 10); let c = days.get(d); if (!c) { c = { n: 0, p: 0, pi: 0 }; days.set(d, c); } c.n++; if (o.P[i] == null) c.p++; if (o.PI[i] == null) c.pi++; });
  o.skipDays = new Set([...days].filter(([, c]) => c.p >= c.n || c.pi >= c.n).map(([d]) => d));
  o.keep = o.t.map(t => !o.skipDays.has(t.slice(0, 10)));
}

// ───────────── aggregation ─────────────
function isoWeek(d) {                                         // "YYYY-Www" (ISO week, Monday first)
  const x = new Date(d + "T00:00:00Z"), day = (x.getUTCDay() + 6) % 7; x.setUTCDate(x.getUTCDate() - day + 3);
  const y = x.getUTCFullYear(), w = 1 + Math.round(((x - new Date(Date.UTC(y, 0, 4))) / 86400000 - 3 + ((new Date(Date.UTC(y, 0, 4)).getUTCDay() + 6) % 7)) / 7);
  return `${y}-W${String(w).padStart(2, "0")}`;
}
const keyFn = f => f === "15min" ? t => t : f === "hour" ? t => t.slice(0, 13) + ":00" : f === "day" ? t => t.slice(0, 10) : f === "week" ? t => isoWeek(t.slice(0, 10))
  : f === "month" ? t => t.slice(0, 7) : f === "quarter" ? t => `${t.slice(0, 4)}-Q${Math.ceil(+t.slice(5, 7) / 3)}` : f === "year" ? t => t.slice(0, 4) : () => "all";
const FIELDS = ["n", "AH", "H", "D", "idc", "pos", "q", "ae", "imb", "res", "ref", "absPos", "absH", "gaps"];
const blank = () => Object.fromEntries(FIELDS.map(k => [k, 0]));
function aggregate(sites, freq, p, mode, ranged = true) {
  const key = keyFn(freq), groups = new Map(), tmp = new Array(8), lo = $("start").value, hi = $("end").value;
  sites.forEach(s => { const o = store[s]; if (!o) return;
    for (let i = 0; i < o.t.length; i++) {
      if (!o.keep[i]) continue;
      if (ranged) { const d = o.t[i].slice(0, 10); if (d < lo || d > hi) continue; }
      const H = o.H[i], AH = o.AH[i]; settleSlot(H, AH, o.F[i], o.P[i], o.AA[i], o.PI[i], p, mode, tmp);
      const k = key(o.t[i]); let g = groups.get(k); if (!g) { g = blank(); groups.set(k, g); }
      g.n++; g.AH += AH; g.H += H; g.D += tmp[0]; g.pos += tmp[1]; g.idc += tmp[2]; g.q += tmp[3]; g.ae += tmp[4]; g.imb += tmp[5]; g.res += tmp[6]; g.ref += tmp[7];
      g.absPos += Math.abs(tmp[1] - AH); g.absH += Math.abs(H - AH);
      g.gaps += (o.P[i] == null) + (o.AA[i] == null && mode === "idc" && o.F[i] != null && tmp[2] !== 0) + (o.PI[i] == null);
    } });
  return [...groups.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1);
}

// ───────────── painting ─────────────
function paint() {
  document.querySelectorAll("#sites button").forEach(b => b.classList.toggle("active", b.dataset.s === selected));
  if (!Object.keys(store).length) return;
  const sites = selected === "ALL" ? SITES : [selected], p = pctVal(), mode = $("mode").value;
  const name = selected === "ALL" ? "All sites" : selected, lead = $("lead").value;
  const rows = aggregate(sites, freq, p, mode);
  const lo = $("start").value, hi = $("end").value;
  const skipped = sites.reduce((n, s) => n + (store[s] ? [...store[s].skipDays].filter(d => d >= lo && d <= hi).length : 0), 0);
  const modeTxt = mode === "idc" ? `rest closed out in IDC (lead ${lead} min)` : "rest left in imbalance";
  setStatus(rows.length ? `${name} · ${nf(Math.round(p * 100))}% DA bid, ${modeTxt}` + (skipped ? ` · ${skipped} site-days left out (no DA / imbalance price yet)` : "") + (loading ? ` · ${loading} (the rest of the year is still loading)` : "")
    : skipped ? `No data to show: all ${skipped} site-days in this period have no DA / imbalance price yet. Pick an earlier period, or check that the price table is up to date (the &ldquo;Build HU Combined Data&rdquo; workflow runs daily at 10:30 UTC).`
    : "No data for this selection.", !rows.length);
  $("revTitle").textContent = `${name} · revenue and total revenue`;
  $("revSub").textContent = `EUR per ${({ "15min": "15 minutes", hour: "hour", day: "day", week: "week", month: "month", quarter: "quarter", year: "year" })[freq]} · ${nf(Math.round(p * 100))}% DA bid, ${modeTxt}`;

  const x = rows.map(([k]) => k), many = x.length > 60;
  const bar = (nm, f, color) => ({ name: nm, type: "bar", stack: "rev", data: rows.map(([, g]) => Math.round(g[f] * 100) / 100), itemStyle: { color }, barMaxWidth: 28 });
  chRev.setOption({ animation: false, tooltip: { trigger: "axis", valueFormatter: v => v == null ? "–" : nf(v, 2) + " EUR" }, legend: { top: 4 },
    grid: { left: 80, right: 24, top: 44, bottom: many ? 64 : 34 }, dataZoom: many ? [{ type: "inside" }, { type: "slider", height: 18, bottom: 6 }] : [{ type: "inside" }],
    xAxis: { type: "category", data: x, axisLabel: { formatter: v => freq === "15min" || freq === "hour" ? v.slice(5) : v } }, yAxis: { type: "value", name: "EUR", nameLocation: "end" },
    series: [ bar("DA revenue", "q", "#2c7fb8"), bar("IDC revenue", "ae", "#e67e22"), bar("Imbalance cost", "imb", "#d98b84"),
      { name: "Total revenue", type: "line", data: rows.map(([, g]) => Math.round(g.res * 100) / 100), lineStyle: { width: 2.2, color: "#2c3e50" }, itemStyle: { color: "#2c3e50" }, showSymbol: x.length < 120, symbolSize: 5 },
      { name: "DA-only (100%)", type: "line", data: rows.map(([, g]) => Math.round(g.ref * 100) / 100), lineStyle: { width: 1.6, color: "#95a5a6", type: "dashed" }, itemStyle: { color: "#95a5a6" }, showSymbol: false } ] }, true);
  summary(sites, p, mode);
  sensitivity(sites, p);
}

// Summary table: January..December of the loaded year for the selected site(s) (the site buttons above), whatever dates the chart shows.
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function summary(sites, p, mode) {
  const year = (dataYear || $("end").value.slice(0, 4)), name = selected === "ALL" ? "All sites" : selected;
  const byMonth = new Map(aggregate(sites, "month", p, mode, false));
  const tot = blank(); let any = false;
  const cell = (g, f) => g ? eur(g[f]) : "–";
  const before = g => g ? g.q + g.ae : null;
  const ipct = g => g && g.res ? sgn(g.imb / g.res * 100, 1) + "%" : "–";
  const row = (label, g, cls = "") => `<tr class="${cls}"><td>${label}</td><td>${cell(g, "q")}</td><td>${cell(g, "ae")}</td><td>${g ? eur(before(g)) : "–"}</td><td>${cell(g, "imb")}</td><td><b>${cell(g, "res")}</b></td><td>${ipct(g)}</td></tr>`;
  const rows = MONTHS.map((m, i) => {
    const g = byMonth.get(`${year}-${String(i + 1).padStart(2, "0")}`);
    if (g) { any = true; FIELDS.forEach(f => { tot[f] += g[f]; }); }
    return row(`${m} ${year}`, g);
  });
  $("sumTitle").textContent = `${name} · summary table`;
  $("sumSub").textContent = `EUR per month, ${year} · ${nf(Math.round(p * 100))}% DA bid, ${mode === "idc" ? `rest closed out in IDC (lead ${$("lead").value} min)` : "rest left in imbalance"}`
    + (loading ? " · the rest of the year is still loading" : "");
  $("sumTable").innerHTML = `<tr><th>Month</th><th>DA revenue €</th><th>IDC revenue €</th><th>Revenue (prior to imbalance cost) €</th><th>Imbalance cost €</th>
      <th>Total revenue (post imbalance cost) €</th><th>Imbalance %</th></tr>` + rows.join("") + row(`Total ${year}`, any ? tot : null, "total");
}

// Total revenue of the selected sites and period for every bid share (steps of 10 points up to 150%, plus the current share), both ways of handling the rest.
function sensitivity(sites, p) {
  const cur = Math.round(p * 100), pts = [];
  for (let v = 0; v <= 150; v += 10) pts.push(v);
  if (!pts.includes(cur)) { pts.push(cur); pts.sort((a, b) => a - b); }
  const tmp = new Array(8), lo = $("start").value, hi = $("end").value;
  const run = (m, v) => { const r = { n: 0, D: 0, q: 0, ae: 0, imb: 0, res: 0, ref: 0 }; sites.forEach(s => { const o = store[s]; if (!o) return;
    for (let i = 0; i < o.t.length; i++) if (o.keep[i] && o.t[i].slice(0, 10) >= lo && o.t[i].slice(0, 10) <= hi) { settleSlot(o.H[i], o.AH[i], o.F[i], o.P[i], o.AA[i], o.PI[i], v / 100, m, tmp);
      r.D += tmp[0]; r.q += tmp[3]; r.ae += tmp[4]; r.imb += tmp[5]; r.res += tmp[6]; r.ref += tmp[7]; } }); return r; };
  const rows = pts.map(v => ({ v, idc: run("idc", v), imb: run("imb", v) }));
  const ref = rows[0].imb.ref, at100 = rows.find(r => r.v === 100);
  const slope = k => (at100 ? (at100[k].res - rows[0][k].res) / 10 : null);
  $("best").innerHTML = `Per +10 points of DA bid: <b class="i">${sgn(slope("idc"))} €</b> with the rest closed out in IDC &nbsp;·&nbsp; <b class="m">${sgn(slope("imb"))} €</b> with the rest left in imbalance &nbsp;·&nbsp; DA-only at 100%: ${eur(ref)} €`;
  const ip = r => r.res ? sgn(r.imb / r.res * 100, 1) + "%" : "–";
  const cells = (r, ref) => `<td class="l">${eur(r.q)}</td><td>${eur(r.ae)}</td><td>${eur(r.imb)}</td><td><b>${eur(r.res)}</b></td><td>${ip(r)}</td><td class="${r.res - ref >= 0 ? "neg" : "pos"}">${sgn(r.res - ref)}</td>`;
  $("sensTable").innerHTML = `<tr><th rowspan="2">DA bid %</th><th rowspan="2">DA bid MWh</th><th class="grp" colspan="6">Rest closed out in IDC (lead ${$("lead").value} min)</th><th class="grp" colspan="6">Rest left in imbalance</th></tr>
    <tr><th class="l">DA revenue €</th><th>IDC revenue €</th><th>Imbalance cost €</th><th>Total revenue €</th><th>Imbalance %</th><th>Δ vs DA-only €</th>
        <th class="l">DA revenue €</th><th>IDC revenue €</th><th>Imbalance cost €</th><th>Total revenue €</th><th>Imbalance %</th><th>Δ vs DA-only €</th></tr>` +
    rows.map(r => `<tr class="${r.v === cur ? "sel" : ""}"><td>${r.v}%${r.v === cur ? " (current)" : ""}</td><td>${nf(r.idc.D / 1000, 1)}</td>${cells(r.idc, ref)}${cells(r.imb, ref)}</tr>`).join("");
}
init();
</script>
