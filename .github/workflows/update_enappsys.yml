name: Daily EnAppSys IDA Update
on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backfill start date, e.g. 2026-08-01. Empty = daily update (last 3 days)"
        type: string
        default: ""
      end_date:
        description: "Backfill end date (exclusive). Empty = tomorrow"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: enappsys-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch HUPX IDA1/2/3 from EnAppSys
        env:
          ENAPPSYS_USER: ${{ secrets.ENAPPSYS_USER }}
          ENAPPSYS_PASS: ${{ secrets.ENAPPSYS_PASS }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          args=()
          [ -n "$START_DATE" ] && args+=(--start "$START_DATE")
          [ -n "$END_DATE" ] && args+=(--end "$END_DATE")
          python py/fetch_enappsys_ida.py "${args[@]}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add private_data/enappsys
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: update EnAppSys HUPX IDA ($(date -u +%F))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
